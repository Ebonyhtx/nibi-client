<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f9f2e4" />
    <meta name="color-scheme" content="light dark" />
    <title>NIBI Conversation Share</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      html[data-nibi-browser-theme-surface="light"],
      html[data-nibi-browser-theme-surface="light"] body,
      html[data-nibi-browser-theme-surface="light"] #root {
        background: var(--color-background, #f9f2e4) !important;
      }

      html[data-nibi-browser-theme-surface="dark"],
      html[data-nibi-browser-theme-surface="dark"] body,
      html[data-nibi-browser-theme-surface="dark"] #root {
        background: var(--color-background, #171614) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
