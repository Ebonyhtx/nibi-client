<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NIBI</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      /* React 挂载前这一层没有任何底色，浏览器默认白 —— 深色用户启动时会先闪一屏白。
         底色按“应用内主题偏好”而不是系统偏好决定：默认外观是浅色，跟随系统的话
         深色系统上的用户会看到深色启动壳接一个浅色界面，反而更闪。
         偏好由下面 head 里的内联脚本在读 localStorage 后写到 html.dark 上。 */
      html,
      body {
        background: #ffffff;
      }

      html.dark,
      html.dark body {
        background: #151718;
      }

      #root {
        opacity: 0;
        transition: opacity 0.16s ease;
      }

      body.zcode-startup-ready #root {
        opacity: 1;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.16s ease;
      }

      body.zcode-startup-ready #loading {
        pointer-events: none;
        opacity: 0;
      }

      .startup-logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        /* 应用图标自带底色与圆角，这里不再套深色壳：套壳会把图形压小、边缘还容易出毛刺。 */
        border-radius: 24px;
        transform: scale(0.72);
        opacity: 0;
        animation: startup-logo-pop 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transform-origin: center;
      }

      .startup-logo {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.2),
          0 8px 10px -6px rgb(0 0 0 / 0.2);
      }

      @keyframes startup-logo-pop {
        0% {
          opacity: 0;
          transform: scale(0.72);
        }

        38% {
          opacity: 1;
          transform: scale(1.045);
        }

        58% {
          transform: scale(0.985);
        }

        76% {
          transform: scale(1.008);
        }

        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-logo-shell {
          opacity: 1;
          transform: scale(1);
          animation: none;
        }
      }

      /* 应用内关掉「界面动效」时同样停掉弹入。这条规则必须写在本页内联样式里：
         启动壳先于应用 bundle 渲染，等 styles.css 里那条全局覆盖生效就已经闪过动画了。 */
      html[data-zcode-motion="off"] .startup-logo-shell {
        opacity: 1;
        transform: scale(1);
        animation: none;
      }
    </style>
    <script>
      // 启动壳是 React 之外的一段独立脚本，读不到 store，只能自己读偏好。
      // 默认值与 @nibi/ui 的 DEFAULT_THEME 一致（浅色）；这里刻意用字面量，因为这段
      // 代码在 JS bundle 之前执行，不能 import，也不该为一个常量引入一次额外请求。
      (() => {
        try {
          const saved = localStorage.getItem("zcode-theme");
          const resolvedDark =
            saved === "dark" ||
            saved === "zai-dark" ||
            (saved === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", resolvedDark);
          document.documentElement.dataset.zcodeMotion =
            localStorage.getItem("zcode-motion") === "false" ? "off" : "on";
        } catch {
          // localStorage 不可用时保持浅色底、保留动效（与两个默认值一致）。
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="loading" class="[app-region:drag]" role="status" aria-busy="true" aria-label="Loading...">
      <div class="startup-logo-shell">
        <!-- NIBI 应用图标（由 tools/make-nibi-app-icons.py 从品牌鸟合成，与任务栏/安装包同一份）。 -->
        <img src="/nibi-app-icon.png" alt="" class="startup-logo" aria-hidden="true" />
      </div>
    </div>
    <script type="module">
      const startupLogoShell = document.querySelector(".startup-logo-shell");
      const startupLoading = document.getElementById("loading");
      const isUpdateStatusWindow =
        new URLSearchParams(window.location.search).get("windowKind") === "update-status";
      // 关掉「界面动效」的用户不该看到启动图标的弹入动画；系统减弱动效同样停用。
      // data-zcode-motion 由上面的 head 脚本落地，这里直接复用，不再读一遍 localStorage。
      const reduceMotion =
        document.documentElement.dataset.zcodeMotion === "off" ||
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let finished = false;
      let animationDone = false;
      let reactReady = false;

      // 修复原因：主入口不能依赖动画结束后的动态 import；一旦导入路径在 Electron/Vite 下失败，
      // 页面会永久停在 HTML loading。这里让主入口静态加载，只把启动壳作为动画遮罩延迟移除。
      const tryFinishStartupAnimation = () => {
        if (finished || !animationDone || !reactReady) return;
        finished = true;
        document.body.classList.add("zcode-startup-ready");
        window.setTimeout(() => startupLoading?.remove(), 500);
      };

      const markAnimationDone = () => {
        animationDone = true;
        tryFinishStartupAnimation();
      };

      const markReactReady = () => {
        reactReady = true;
        tryFinishStartupAnimation();
      };

      if (isUpdateStatusWindow) {
        // Bugfix: 更新状态窗口本身就是一个轻量弹窗，复用主入口 HTML 时不应再显示启动壳。
        // 否则透明独立窗口里的启动 logo 会短暂或持续盖在更新按钮上，看起来像弹窗 UI 异常。
        finished = true;
        document.body.classList.add("zcode-startup-ready");
        startupLoading?.remove();
      } else {
        window.addEventListener("zcode-react-startup-ready", markReactReady, { once: true });
      }

      if (isUpdateStatusWindow || reduceMotion || !startupLogoShell) {
        markAnimationDone();
      } else {
        startupLogoShell.addEventListener("animationend", markAnimationDone, { once: true });
        window.setTimeout(markAnimationDone, 1000);
      }

      if (!isUpdateStatusWindow) {
        window.setTimeout(markReactReady, 3000);
      }
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
