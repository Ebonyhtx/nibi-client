      的运行期循环。抽到同目录 commandStorage.ts 后两边共用同一份存储规则（`.nibi` 优先、
      `.agents` 兼容、override 写 `config.json`），命令服务与同步服务都只依赖它。
      packages/services/src/commands 仍是未受管目录，接管整目录不在本次范围内。

