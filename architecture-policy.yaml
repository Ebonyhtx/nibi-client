global:
  # 临时时间戳（2026-09-10）：unmanaged-new-file 只约束此日期之后首次入库的文件。
  # 基于领先 staging 很多的分支开工时，merge-base 之前的"新增"文件不应被追溯。
  newFilesEnforcedSince: "2026-09-10"
  acceptedUpstreamCommits: []
  maxFileLines: 800
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true
  # 上溯快照记录 3.16.2 基座里上游原样内容（pristine），lint 的 max-lines 存量豁免按它判定。
  # 注意：NIBI fork 以 3.16.2 整体同步为基线，快照里的 introduced 列表已清空——
  # 那些文件是基座，不是本分支新写代码；再次同步上游时才需要按新版本重新生成 introduced。
  acceptedUpstreamSnapshot: scripts/architecture/upstream-snapshot.json

exceptions:
  - id: side-pane-full-view-shortcut-command-edit
    rule: unmanaged-new-file
    paths: [ packages/shared/src/shortcutCommands.ts ]
    reason: 已准入的快捷键命令表只追加一条 toggleSidePaneFullView 命令（Side Pane 完整视图，docs/ui/side-pane-full-view.md）；命令表仍是唯一数据源，签名与模块边界不变，接管整个 shared 包不在本次范围内。
  - id: opensource-cua-test-project-config
    rule: unmanaged-new-file
    paths: [ packages/zcode-cua/vitest.config.ts ]
    reason: 该文件只装配测试项目，开源占位版本用于保持根单测入口可运行；不包含 producer 运行逻辑，不为同目录实现文件开放例外。
  - id: opensource-tool-search-comment-cleanup
    rule: unmanaged-new-file
    paths:
      - apps/zcode-cli/packages/contracts/src/tools/tool-search.ts
      - apps/zcode-cli/packages/core/src/tool/handlers/tool-search.ts
    reason: 已有上游文件仅去掉两行产品对标注释；去除注释后的 TypeScript 输出与 staging 完全一致。契约、实现和模块边界不变，整目录接管不在本次开源整理范围内；后续逻辑修改须重新核对模块治理。
  - id: project-location-cache-recovery-existing-edit
    rule: unmanaged-new-file
    paths:
      - packages/services/src/credential/credentialService.ts
    reason: 已有项目 Token 与凭据存储增加派生缓存的局部恢复端口；保持原有 owner 和共享文件锁，不接管全目录。
  - id: test-ids-subpath-import-unmanaged-edit
    rule: unmanaged-new-file
    paths:
      - packages/ui/src/browser-use/EmbeddedBrowserPermissionPrompts.tsx
      - packages/ui/src/settings/DynamicWorkflowModeSetting.tsx
    reason: 已准入的存量文件只把 TID 导入从 @nibi/shared 根入口改为 @nibi/shared/test-ids 子路径（根入口不再导出 test-ids，以收窄受影响单测范围）；行为与模块边界不变，接管 ui 目录不在本次范围内。
  # 原 `connection-log-secret-token-unmanaged-edit` 与
  # `connection-errors-econnreset-unmanaged-edit` 两条准入：`source-server/` 已在
  # 2026-11-07 登记为 managed 模块（见 modules 里的 shared-source-server），新文件不再需要
  # 逐条准入，两条一并删除（unmanaged-new-file 从 32 条降到 30 条）。
  - id: source-server-ansi-control-regex-disable
    rule: disable-count
    paths: [ packages/shared/src/source-server/connectionLog.ts ]
    reason: 该文件唯一的 lint disable 是 ANSI 清除正则的 `no-control-regex`——这条正则要匹配的就是控制序列本身，去掉就无法脱敏用户可见日志。
  - id: client-config-public-field-unmanaged-edit
    rule: unmanaged-new-file
    paths: [ packages/shared/src/clientConfig.ts ]
    reason: Existing upstream public config parser gains one validated recommendation field; ownership and module boundaries remain unchanged, and adopting the shared package is outside this change.
  - id: shortcut-settings-existing-ui-edit
    rule: unmanaged-new-file
    paths:
      - packages/ui/src/components/ui/kbd.tsx
      - packages/ui/src/settings/ShortcutSearchBar.tsx
      - packages/ui/src/settings/ShortcutSettingsSection.tsx
    reason: Existing upstream shortcut components and keycap primitive edited for shared controls, responsive layout and save admission; adopting the entire settings directory requires a separate boundary refactor.
  - id: sidebar-workflow-tooltip-existing-ui-edit
    rule: unmanaged-new-file
    paths: [ packages/ui/src/components/workflow-run-line/WorkflowRunRail.tsx ]
    reason: Existing upstream workflow rail edited only to adapt native titles within the sidebar tooltip scope; workflow ownership and imports remain unchanged except for the shared UI tooltip adapter.
  - id: onboarding-existing-module-edit
    rule: unmanaged-new-file
    paths:
      - packages/services/src/onboarding/
      - packages/ui/src/onboarding/
    reason: onboarding 目录（记录持久化服务与触发 hook）是已合入 staging 的存量功能模块，本轮修复在其既有边界内收紧老用户判定与兜底；模块 adopt 登记需单独的边界梳理，不在本缺陷修复内展开。
  - id: remote-connection-flow-existing-size
    rule: max-file-lines
    paths: [ packages/ui/src/remote-connection-flow/index.ts ]
    reason: Preserve the existing single hook owner and closure; module adoption must not mechanically split state to satisfy line counts.
  - id: dwf-engine-sidecar-size
    rule: max-file-lines
    paths: [ apps/zcode-cli/packages/cli/src/dwf-engine/dwf-engine-command.ts ]
    reason: DWF 引擎侧车宿主（路线 C）是一个内聚的状态机 + 行协议端 + 中枢 RPC 承载，逐段拆分只会把同一条 dispatch 表切成文件边界；字段级对拍由 check-dwf-engine 门禁与 contract.test 兜底（对端 kernel/crates/cli/src/dwf_engine_client.rs 同批变更）。
  - id: gen-ui-tweak-runtime-size
    rule: max-file-lines
    paths: [ packages/desktop/src/renderer/src/plugin-sandbox/genUiTweakRuntime.js ]
    reason: Keep parameter binding and registration lifecycle together; runtime-manifest.json and tests verify file integrity.
  - id: gen-ui-tweak-runtime-lint
    rule: disable-count
    paths: [ packages/desktop/src/renderer/src/plugin-sandbox/genUiTweakRuntime.js ]
    reason: Allow the control-character validation regex and the single-file parameter-control runtime.
  - id: nibi-rebrand-and-paid-gate-implementation
