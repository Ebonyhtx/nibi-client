      adapters: .
    owner: persistence
  # cli-subagent-config：由 architecture:adopt 登记
  - id: cli-subagent-config
    roots:
      - apps/zcode-cli/packages/bootstrap/src/runtime-subagents
      - apps/zcode-cli/packages/bootstrap/tests/runtime-subagents
    managed: true
    requires:
      - shared
    publicEntrypoints:
      - apps/zcode-cli/packages/bootstrap/src/runtime-subagents/index.ts
      - apps/zcode-cli/packages/bootstrap/src/runtime-subagents/contract.ts
