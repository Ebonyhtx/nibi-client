      domain: domain
      app: app
      adapters: adapters
      ui: ui
    owner: remote
    layerOrder:
      - contract
      - domain
      - app
      - adapters
      - ui

  # 保留既有源码位置；精确登记源文件，不扩大到整个 CLI 或 handlers 目录。
