  - id: rust-migration-unmanaged-files
    rule: unmanaged-new-file
    paths:
      - apps/zcode-cli/packages/bootstrap/src/app/storage-paths.ts
      - apps/zcode-cli/packages/bootstrap/src/plugin-management.ts
      - packages/desktop/src/host/localPluginManagementService.ts
      - packages/services/src/zcode-agent/taskStreamFromV4.ts
      - packages/services/src/zcode-agent/nodeReplHostEnv.ts
      - packages/zcode-server-cli/src/packaging/nodeDistIntegrity.ts
    reason: >-
      Rust 内核改造期间的六个新文件：storage-paths / plugin-management 是从 bootstrap 既有实现抽出的 同层文件，localPluginManagementService 让插件管理留在 Host（不再转 agent），taskStreamFromV4 是 v4 事件到旧 task 事件的投影，nodeReplHostEnv 把 Host 注入的 node_repl 执行面投影成子进程环境， nodeDistIntegrity 是 Server CLI 下载 Node 二进制的 sha256 校验。 四处所属目录（zcode-cli bootstrap、desktop/host、services/zcode-agent、zcode-server-cli）都还是 上游的未受管大区，逐个接管要单独一轮模块边界重构；这里按路径逐个登记，不放开整目录。

