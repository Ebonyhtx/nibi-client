version: 1

# 存量模块先标记为 legacy；新模块或完成迁移的模块设置 managed: true。
modules:
  - id: rpc
    roots: [ packages/rpc/src ]
    managed: false
  - id: shared
    roots: [ packages/shared/src ]
    managed: false
  # 远程目标（SSH / WSL）的契约、校验与连接日志。shared 整体仍是 legacy，但这个子目录已经
  # 是独立边界：只有 shared 包内部按相对路径进它，外部一律经 @nibi/shared 桶，所以先把它
  # 单独纳入 managed，而不是等整个 shared 包接管。
  - id: shared-source-server
    roots: [ packages/shared/src/source-server ]
    managed: true
    requires: [ shared ]
    publicEntrypoints:
      - packages/shared/src/source-server/index.ts
      - packages/shared/src/source-server/contract.ts
    owner: remote
  - id: provider
    roots: [ packages/provider/src ]
    managed: false
  - id: provider-node
    roots: [ packages/provider-node/src ]
    managed: false
  - id: services
    roots: [ packages/services/src ]
    managed: false
  - id: session
    roots: [ packages/services/src/session ]
    managed: false
    requires: [ shared ]
    publicEntrypoints:
      - packages/services/src/session/contract.ts
      - packages/services/src/session/taskIndexRepo.ts
      - packages/services/src/session/automationRepo.ts
      - packages/services/src/session/tasksDatabase/migrations.ts
      - packages/services/src/session/tasksDatabase/prepared.ts
    owner: conversation
  - id: storage
    roots: [ packages/services/src/storage ]
    managed: true
    requires: [ shared, rpc, services ]
    publicEntrypoints: [ packages/services/src/storage/contract.ts ]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [ domain, app, adapters ]
    owner: desktop-settings
  - id: client
    roots: [ packages/client/src ]
    managed: false
  - id: server
    roots: [ packages/server/src ]
    managed: false
  - id: zcode-server-cli
    roots: [ packages/zcode-server-cli/src ]
    managed: false
  - id: ui
    roots: [ packages/ui/src ]
    managed: false
  - id: web
    roots: [ packages/web/src ]
    managed: false
  - id: desktop
    roots: [ packages/desktop/src ]
    managed: false
  - id: formal-proof
    roots: [ packages/formal-proof/src ]
    managed: false
  - id: stream-animate
    roots: [ packages/stream-animate/src ]
    managed: false
  - id: e2e-report
    roots: [ packages/e2e-report/src ]
    managed: false
  - id: zcode-cli
    roots: [ apps/zcode-cli ]
    managed: false
  # sqlite-migrations：由 architecture:adopt 登记
  - id: sqlite-migrations
    roots:
      - packages/shared/src/sqlite-migrations
    managed: true
    requires: []
    publicEntrypoints:
      - packages/shared/src/sqlite-migrations/index.ts
      - packages/shared/src/sqlite-migrations/contract.ts
    layers:
      adapters: .
    owner: persistence
  # project-storage：由 architecture:adopt 登记
  - id: project-storage
    roots:
      - packages/services/src/project-storage
    managed: true
    requires:
      - shared
      - sqlite-migrations
      - services
      - session
    publicEntrypoints:
      - packages/services/src/project-storage/index.ts
      - packages/services/src/project-storage/contract.ts
      - packages/services/src/project-storage/startup.ts
      - packages/services/src/project-storage/startup-entry.ts
    layers:
      adapters: .
    owner: conversation
  # project：由 architecture:adopt 登记
  - id: project
    roots:
      - packages/services/src/project
    managed: true
    requires: [ project-storage, services, shared ]
    publicEntrypoints:
      - packages/services/src/project/index.ts
      - packages/services/src/project/contract.ts
    layers:
      adapters: .
    owner: conversation
  # task-facts：由 architecture:adopt 登记
  - id: task-facts
    roots:
      - packages/services/src/task-facts
    managed: true
    requires: [ shared ]
    publicEntrypoints:
      - packages/services/src/task-facts/index.ts
      - packages/services/src/task-facts/contract.ts
      - packages/services/src/task-facts/repairSubagentTaskIndex.ts
    layers:
      app: .
    owner: conversation
  # project-sidebar：由 architecture:adopt 登记
  - id: project-sidebar
    roots:
      - packages/ui/src/project-sidebar
    managed: true
    requires:
      - services
      - shared
      - ui
      - conversation-workspace-target
      - web-remote-control-ui
      - remote-connection-flow
    publicEntrypoints:
      - packages/ui/src/project-sidebar/index.tsx
      - packages/ui/src/project-sidebar/contract.ts
      - packages/ui/src/project-sidebar/remote-project-connection.ts
      - packages/ui/src/project-sidebar/useSavedWorkflowProjectOptions.ts
      - packages/ui/src/project-sidebar/RemoteProjectMenu.tsx
      - packages/ui/src/project-sidebar/WorkspaceDragOverlay.tsx
      - packages/ui/src/project-sidebar/useRemoteProjectConnectionPresentation.ts
      - packages/ui/src/project-sidebar/OfflineRemoteProjectRows.tsx
      - packages/ui/src/project-sidebar/RemoteConversationDisconnected.tsx
    layers:
      contract: contract.ts
      ui: .
    owner: conversation
  # remote-projects：由 architecture:adopt 登记
  - id: remote-projects
    roots:
      - packages/services/src/remote-projects
    managed: true
    requires: [ services, shared, project-storage ]
    publicEntrypoints:
      - packages/services/src/remote-projects/index.ts
      - packages/services/src/remote-projects/contract.ts
    layers:
      adapters: .
    owner: conversation
  # startup-storage：由 architecture:adopt 登记
  - id: startup-storage
    roots:
      - packages/services/src/startup-storage
    managed: true
    requires:
      - sqlite-migrations
    publicEntrypoints:
      - packages/services/src/startup-storage/index.ts
      - packages/services/src/startup-storage/contract.ts
    layers:
      adapters: .
    owner: persistence
  # workspace-config-catalog：由 architecture:adopt 登记
  - id: workspace-config-catalog
    roots:
      - packages/ui/src/workspace-config-catalog
    managed: true
    requires: [ services, shared, ui ]
    publicEntrypoints:
      - packages/ui/src/workspace-config-catalog/index.ts
      - packages/ui/src/workspace-config-catalog/contract.ts
    layers:
      contract: contract.ts
      app: catalog.ts
      ui: .
    owner: configuration
  # settings-scope：由 architecture:adopt 登记
  - id: settings-scope
    roots:
      - packages/ui/src/settings-scope
    managed: true
    requires: [ conversation-workspace-target, services, shared, ui, workspace-config-catalog ]
    publicEntrypoints:
      - packages/ui/src/settings-scope/index.ts
      - packages/ui/src/settings-scope/contract.ts
    layers:
      contract: contract.ts
      domain: domain
      app: app
      ui: ui
    layerOrder: [ contract, domain, app, ui ]
    owner: configuration
  # data-sync：B1 技能单类试点（数据同步页）
  - id: data-sync
    roots:
      - packages/ui/src/data-sync
    managed: true
    requires: [ services, settings-scope, shared, ui ]
    publicEntrypoints:
      - packages/ui/src/data-sync/index.ts
      - packages/ui/src/data-sync/contract.ts
    layers:
      contract: contract.ts
      domain: domain
      app: app
      ui: ui
    layerOrder: [ contract, domain, app, ui ]
    owner: remote
  # image-preview-editor：C2 图片预览标注并作为附件发送（归一化标注 + 输入框目标桥）
  - id: image-preview-editor
    roots:
      - packages/ui/src/image-preview-editor
    managed: true
    requires: [ ui ]
    publicEntrypoints:
      - packages/ui/src/image-preview-editor/index.ts
      - packages/ui/src/image-preview-editor/contract.ts
    layers:
      contract: contract.ts
      domain: geometry.ts
      ui: .
    layerOrder: [ contract, domain, ui ]
    owner: conversation
  # data-sync-service：B1 数据同步六分类（技能/MCP/命令/钩子/子智能体/inline 插件）
  - id: data-sync-service
    roots:
      - packages/services/src/data-sync
    managed: true
    requires: [ services, shared ]
    publicEntrypoints:
      - packages/services/src/data-sync/index.ts
      - packages/services/src/data-sync/contract.ts
      - packages/services/src/data-sync/node.ts
    layers:
      app: .
    owner: remote
  # project-catalog：由 architecture:adopt 登记
  - id: project-catalog
    roots:
      - packages/services/src/project-catalog
    managed: true
    requires: [ project, remote-projects ]
    publicEntrypoints:
      - packages/services/src/project-catalog/index.ts
      - packages/services/src/project-catalog/contract.ts
    layers:
      contract: contract.ts
      domain: selection-id.ts
      app: .
    owner: conversation
  # bot-project-runtime：由 architecture:adopt 登记
  - id: bot-project-runtime
    roots:
      - packages/services/src/bot-project-runtime
    managed: true
    requires: [ services, shared, remote-projects ]
    publicEntrypoints:
      - packages/services/src/bot-project-runtime/index.ts
      - packages/services/src/bot-project-runtime/contract.ts
    layers:
      contract: contract.ts
      app: .
    owner: conversation
  # project-workspace-navigation：由 architecture:adopt 登记
  - id: project-workspace-navigation
    roots:
      - packages/services/src/project-workspace-navigation
    managed: true
    requires: [ project, project-catalog, remote-projects, shared ]
    publicEntrypoints:
      - packages/services/src/project-workspace-navigation/index.ts
      - packages/services/src/project-workspace-navigation/contract.ts
    layers:
      contract: contract.ts
      app: .
    owner: conversation
  # conversation-workspace-target：由 architecture:adopt 登记
  - id: conversation-workspace-target
    roots:
      - packages/ui/src/conversation-workspace-target
    managed: true
    requires: [ shared, ui ]
    publicEntrypoints:
      - packages/ui/src/conversation-workspace-target/index.ts
      - packages/ui/src/conversation-workspace-target/contract.ts
      - packages/ui/src/conversation-workspace-target/purpose.ts
      - packages/ui/src/conversation-workspace-target/sourceIdentity.ts
      - packages/ui/src/conversation-workspace-target/workbenchTarget.ts
      - packages/ui/src/conversation-workspace-target/usePluginCreator.ts
      - packages/ui/src/conversation-workspace-target/PluginAddMenu.tsx
    layers:
      contract: contract.ts
      app: .
    owner: conversation

  - id: gen-ui-protocol
    roots: [ packages/shared/src/gen-ui ]
    managed: true
    requires: []
    publicEntrypoints: [ packages/shared/src/gen-ui/index.ts, packages/shared/src/gen-ui/contract.ts ]
    layers: { domain: "." }
    owner: conversation
  - id: gen-ui-service
    roots: [ packages/services/src/gen-ui ]
    managed: true
    requires: [ services, shared, rpc, gen-ui-protocol, mcp-apps-protocol ]
    publicEntrypoints: [ packages/services/src/gen-ui/index.ts, packages/services/src/gen-ui/contract.ts, packages/services/src/gen-ui/node.ts ]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [ domain, app, adapters ]
    owner: conversation

  - id: gen-ui
    roots: [ packages/ui/src/gen-ui ]
    managed: true
    requires: [ ui, services, gen-ui-service, gen-ui-protocol, mcp-apps-protocol, plugin-ui ]
    publicEntrypoints: [ packages/ui/src/gen-ui/index.ts, packages/ui/src/gen-ui/contract.ts, packages/ui/src/gen-ui/host.ts ]
    layers: { domain: domain, app: app, adapters: adapters, ui: components }
    layerOrder: [ domain, app, adapters, ui ]
    owner: conversation

  # 插件 UI（MCP Apps 沙箱）：模块边界见各模块 CONTRACT.md。
  - id: mcp-apps-protocol
    roots: [ packages/shared/src/mcp-apps ]
    managed: true
    requires: []
    publicEntrypoints: [ packages/shared/src/mcp-apps/index.ts, packages/shared/src/mcp-apps/contract.ts, packages/shared/src/mcp-apps/hostContract.ts ]
    layers:
      domain: "."
    owner: plugin
  - id: mcp-ui
    roots: [ apps/zcode-cli/packages/bootstrap/src/nibi-protocol/mcp-ui ]
    managed: true
    requires: [ zcode-cli, shared, mcp-apps-protocol ]
    publicEntrypoints: [ apps/zcode-cli/packages/bootstrap/src/nibi-protocol/mcp-ui/index.ts, apps/zcode-cli/packages/bootstrap/src/nibi-protocol/mcp-ui/contract.ts ]
    layers:
      app: "."
    owner: plugin
  - id: plugin-ui-bridge
    roots: [ packages/services/src/plugin-ui-bridge ]
    managed: true
    requires: [ services, shared, mcp-apps-protocol ]
    publicEntrypoints: [ packages/services/src/plugin-ui-bridge/index.ts, packages/services/src/plugin-ui-bridge/contract.ts, packages/services/src/plugin-ui-bridge/appToolsContract.ts, packages/services/src/plugin-ui-bridge/samplingContract.ts ]
    layers:
      app: "."
    owner: plugin
  - id: plugin-sandbox
    roots:
      - packages/desktop/src/main/pluginSandbox
      - packages/desktop/src/host/pluginSandbox
      - packages/desktop/src/preload/pluginSandbox
      - packages/desktop/src/renderer/src/plugin-sandbox
    managed: true
    requires: [ desktop, shared, mcp-apps-protocol, gen-ui-protocol ]
    publicEntrypoints:
      [
        packages/desktop/src/host/pluginSandbox/index.ts,
        packages/desktop/src/host/pluginSandbox/contract.ts,
        packages/desktop/src/preload/pluginSandbox/hostBridge.ts,
        packages/desktop/src/main/pluginSandbox/index.ts,
        packages/desktop/src/main/pluginSandbox/contract.ts,
        # 页面兼容接口由宿主及其契约测试维护。
        packages/desktop/src/renderer/src/plugin-sandbox/aliasRuntime.ts,
        packages/desktop/src/renderer/src/plugin-sandbox/aliasApi.ts
      ]
    layers:
      adapters: "."
    owner: plugin
  - id: plugin-ui
    roots: [ packages/ui/src/plugin-ui ]
    managed: true
    requires: [ ui, shared, services, mcp-apps-protocol, plugin-ui-bridge, plugin-sandbox ]
    publicEntrypoints: [ packages/ui/src/plugin-ui/index.ts, packages/ui/src/plugin-ui/contract.ts, packages/ui/src/plugin-ui/hostPrimitives.ts ]
    layers:
      domain: domain
      app: app
      adapters: adapters
      ui: components
    layerOrder: [ domain, app, adapters, ui ]
    owner: plugin
  # remote-connection-flow：由 architecture:adopt 登记
  - id: remote-connection-flow
    roots:
      - packages/ui/src/remote-connection-flow
    managed: true
    requires:
      - shared
      - ui
    publicEntrypoints:
      - packages/ui/src/remote-connection-flow/index.ts
      - packages/ui/src/remote-connection-flow/contract.ts
      - packages/ui/src/remote-connection-flow/ui/RemoteConnectionProgress.tsx
    layers:
      app: .
      ui: ui
    layerOrder: [ app, ui ]
    owner: remote
  # project-workflow：由 architecture:adopt 登记
  - id: project-workflow
    roots:
      - packages/ui/src/project-workflow
    managed: true
    requires:
      - shared
      - ui
      - project-sidebar
    publicEntrypoints:
      - packages/ui/src/project-workflow/contract.ts
      - packages/ui/src/project-workflow/useWorkflowRunSave.ts
      - packages/ui/src/project-workflow/WorkflowRunSaveControls.tsx
      - packages/ui/src/project-workflow/WorkflowRunPaneSaveSlots.tsx
    layers:
      app: .
    owner: conversation
  # host-database-startup：由 architecture:adopt 登记
  - id: host-database-startup
    roots:
      - packages/desktop/src/host/database-startup
    managed: true
    requires:
      - project-storage
      - shared
      - desktop
    publicEntrypoints:
      - packages/desktop/src/host/database-startup/contract.ts
      - packages/desktop/src/host/database-startup/tasksStorageWorker.ts
      - packages/desktop/src/host/database-startup/hostDatabaseStartup.ts
      - packages/desktop/src/host/database-startup/storagePreparationProcesses.ts
    layers:
      adapters: .
    owner: persistence
  # cli-subagent-config：由 architecture:adopt 登记
  - id: cli-subagent-config
    roots:
      - apps/zcode-cli/packages/bootstrap/src/runtime-subagents
      - apps/zcode-cli/packages/bootstrap/tests/runtime-subagents
    managed: true
    requires:
      - shared
    publicEntrypoints:
      - apps/zcode-cli/packages/bootstrap/src/runtime-subagents/index.ts
      - apps/zcode-cli/packages/bootstrap/src/runtime-subagents/contract.ts
    layers:
      domain: .
    owner: agent
  # cli-session-execution：由 architecture:adopt 登记
  - id: cli-session-execution
    roots:
      - apps/zcode-cli/packages/bootstrap/src/session-execution
      - apps/zcode-cli/packages/bootstrap/tests/session-execution
    managed: true
    requires:
      - shared
      - zcode-cli
    publicEntrypoints:
      - apps/zcode-cli/packages/bootstrap/src/session-execution/index.ts
      - apps/zcode-cli/packages/bootstrap/src/session-execution/contract.ts
    layers:
      app: .
    owner: conversation
  # cli-session-lifecycle：由 architecture:adopt 登记
  - id: cli-session-lifecycle
    roots:
      - apps/zcode-cli/packages/bootstrap/src/session-lifecycle
      - apps/zcode-cli/packages/bootstrap/tests/session-lifecycle
    managed: true
    requires:
      - shared
      - zcode-cli
    publicEntrypoints:
      - apps/zcode-cli/packages/bootstrap/src/session-lifecycle/index.ts
      - apps/zcode-cli/packages/bootstrap/src/session-lifecycle/contract.ts
    layers:
      app: .
    owner: conversation
  # web-remote-relay：由 architecture:adopt 登记
  - id: web-remote-relay
    roots:
      - packages/shared/src/web-remote-relay
    managed: true
    requires: []
    publicEntrypoints:
      - packages/shared/src/web-remote-relay/index.ts
      - packages/shared/src/web-remote-relay/contract.ts
    layers:
      contract: contract.ts
      domain: domain
      adapters: .
    owner: remote
    layerOrder:
      - contract
      - domain
      - app
      - adapters
      - ui
  # desktop-web-remote-relay：由 architecture:adopt 登记
  - id: desktop-web-remote-relay
    roots:
      - packages/desktop/src/main/web-remote-relay
    managed: true
    requires:
      - client
      - desktop
      - shared
      - web-remote-relay
    publicEntrypoints:
      - packages/desktop/src/main/web-remote-relay/index.ts
      - packages/desktop/src/main/web-remote-relay/contract.ts
    layers:
      contract: contract.ts
      adapters: .
    owner: remote
    layerOrder:
      - contract
      - domain
      - app
      - adapters
      - ui
  # mobile-ui：由 architecture:adopt 登记
  - id: mobile-ui
    roots:
      - packages/ui/src/components/mobile-ui
    managed: true
    requires:
      - ui
    publicEntrypoints:
      - packages/ui/src/components/mobile-ui/index.ts
      - packages/ui/src/components/mobile-ui/contract.ts
      - packages/ui/src/components/mobile-ui/DevicePlatformIcon.tsx
      - packages/ui/src/components/mobile-ui/NibiAppLogo.tsx
      - packages/ui/src/components/mobile-ui/bottom-sheet.tsx
    layers:
      contract: contract.ts
      ui: .
    owner: remote
    layerOrder:
      - contract
      - domain
      - app
      - adapters
      - ui
  # web-remote-control-ui：由 architecture:adopt 登记
  - id: web-remote-control-ui
    roots:
      - packages/ui/src/web-remote-control
    managed: true
    requires:
      - mobile-ui
      - services
      - shared
      - ui
    publicEntrypoints:
      - packages/ui/src/web-remote-control/index.ts
      - packages/ui/src/web-remote-control/contract.ts
      - packages/ui/src/web-remote-control/WebRemoteControlDeviceHeader.tsx
      - packages/ui/src/web-remote-control/app/useWebRemoteControlAuthSync.ts
    layers:
      contract: contract.ts
      domain: domain
      app: app
      ui: .
    owner: remote
    layerOrder:
      - contract
      - domain
      - app
      - adapters
      - ui
  # web-remote-control：由 architecture:adopt 登记
  - id: web-remote-control
    roots:
      - packages/web/src/web-remote-control
    managed: true
    requires:
      - client
      - mobile-ui
      - shared
      - ui
      - web
      - web-remote-relay
    publicEntrypoints:
      - packages/web/src/web-remote-control/index.ts
      - packages/web/src/web-remote-control/contract.ts
      - packages/web/src/web-remote-control/views.ts
      - packages/web/src/web-remote-control/adapters/webRemoteControlThemeSeed.ts
    layers:
      contract: contracts
      domain: domain
      app: app
      adapters: adapters
      ui: ui
    owner: remote
    layerOrder:
      - contract
      - domain
      - app
      - adapters
      - ui

  # 保留既有源码位置；精确登记源文件，不扩大到整个 CLI 或 handlers 目录。
  - id: cli-arguments
    roots:
      - apps/zcode-cli/packages/cli/src/argument-parsing
      - apps/zcode-cli/packages/cli/src/arguments.ts
      - apps/zcode-cli/packages/cli/tests/argument-parsing
    managed: true
    requires: []
    publicEntrypoints:
      - apps/zcode-cli/packages/cli/src/arguments.ts
      - apps/zcode-cli/packages/cli/src/argument-parsing/contract.ts
    layers: { adapters: . }
    owner: agent
  - id: workflow-tool-entrypoints
    roots:
      - apps/zcode-cli/packages/core/src/tool/workflow-entrypoints
      - apps/zcode-cli/packages/core/src/tool/handlers/amend-workflow.ts
      - apps/zcode-cli/packages/core/src/tool/handlers/list-models.ts
      - apps/zcode-cli/packages/core/src/tool/handlers/fill-workflow-hole.ts
      - apps/zcode-cli/packages/core/tests/workflow-entrypoints
    managed: true
    requires: [ zcode-cli ]
    publicEntrypoints:
      - apps/zcode-cli/packages/core/src/tool/handlers/amend-workflow.ts
      - apps/zcode-cli/packages/core/src/tool/handlers/list-models.ts
      - apps/zcode-cli/packages/core/src/tool/handlers/fill-workflow-hole.ts
      - apps/zcode-cli/packages/core/src/tool/workflow-entrypoints/contract.ts
    layers: { app: . }
    owner: agent

  - id: tool-result-settlement
    roots:
      - apps/zcode-cli/packages/core/src/runtime/tool-result-settlement
      - apps/zcode-cli/packages/core/src/runtime/methods/tool-result-settlement.ts
      - apps/zcode-cli/packages/core/tests/tool-result-settlement
    managed: true
    requires: [ zcode-cli ]
    publicEntrypoints:
      - apps/zcode-cli/packages/core/src/runtime/methods/tool-result-settlement.ts
      - apps/zcode-cli/packages/core/src/runtime/tool-result-settlement/contract.ts
    layers: { app: . }
    owner: agent
  - id: channel-reply-tool
    roots:
      - apps/zcode-cli/packages/core/src/tool/channel-reply
      - apps/zcode-cli/packages/core/src/tool/handlers/reply-to-channel.ts
      - apps/zcode-cli/packages/core/tests/channel-reply
    managed: true
    requires: [ shared, zcode-cli ]
    publicEntrypoints:
      - apps/zcode-cli/packages/core/src/tool/handlers/reply-to-channel.ts
      - apps/zcode-cli/packages/core/src/tool/channel-reply/contract.ts
    layers: { app: . }
    owner: agent

  # composer-toolbar-layout：登记既有 DOM 布局入口，不改调用路径。
  - id: composer-toolbar-layout
    roots:
      - packages/ui/src/composer-toolbar-layout
      - packages/ui/src/prompt-editor/useComposerToolbarFit.ts
      - packages/ui/test/composer-toolbar-layout
    managed: true
    requires: []
    publicEntrypoints:
      - packages/ui/src/prompt-editor/useComposerToolbarFit.ts
      - packages/ui/src/composer-toolbar-layout/contract.ts
