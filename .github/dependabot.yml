# Dependabot version updates are limited to the pinned GitHub Actions above.
# npm dependency maintenance is intentionally not automated as version-update
# PRs; alert-driven Dependabot security updates remain active via repository
# settings and are triaged individually.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
