name: rust-npm-packages

# npm 包：`@nibi-studio/cli-<platform>` 平台包（构建 + 打包成 tarball）与
# `@nibi-studio/cli` META 入口包（只含 `bin/nibi` 启动器）。
#
# 平台包的消费方是 Rust 内核的 `machines/executor_dist`（从 npm 注册表取 tarball、校验
# `dist.integrity` 的 sha512、解出 `package/bin/nibi-rs`）。META 包的消费方是终端用户：
# `npm install -g @nibi-studio/cli` 后，启动器按 os/arch 解析同版本平台包里的 `nibi-rs`。
#
# 发布顺序是硬约束：先发全部平台包，最后发 META（`meta` job 的 `needs: publish`）。
# META 的 optionalDependencies 精确锁定同版本平台包，任何一个先缺都会让该平台装不出可用的
# `nibi`，所以不能并行、也不能先发 META。
#
# 发布走 **npm trusted publishing（OIDC）**，不需要任何 token/secret，所以能留在公开仓：
# 每条 publish 用的是 GitHub Actions 签发的短期 OIDC 令牌，npm 只接受在包的
# 「Trusted Publisher」设置里登记过的 仓库 + workflow 文件名（本文件：rust-npm-packages.yml）。
# 前置（一次性，运营者在 npmjs.com 上给每个已发布的包各配一次，包括 META 包
# `@nibi-studio/cli`）：组织/用户 `Ebonyhtx`、仓库 `nibi-client`、workflow
# `rust-npm-packages.yml`、允许 `npm publish`。新包（如 `@nibi-studio/cli-win32-x64-msvc`
# 或 `@nibi-studio/cli`）首次发布前要先确认 trusted publisher 已登记。
#
# 自动发布只在手动触发 `publish: true` 时跑（版本号一经 publish 就永久占用），
# 默认的 push / PR 只打包上传 artifact。
#
# 所有 action 必须钉到完整 commit SHA（public-repo-policy 要求）。

on:
  push:
    # 只写了 `tags` 时 GitHub **不会**为分支推送触发（分支过滤是未定义状态）。这里只在发布分支
    # `main` 上打包（`dev` 的 kernel 变更不跑平台 release 构建，避免拖长流水线）；打
    # `v<版本>` 标签才发布，`dev` 上要临时打包/发版走 workflow_dispatch。
    branches:
      - "main"
    paths:
      - "kernel/**"
      - "scripts/rust-cli/npm/**"
      - ".github/workflows/rust-npm-packages.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "kernel/**"
      - "scripts/rust-cli/npm/**"
      - ".github/workflows/rust-npm-packages.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the packed tarballs to npm (trusted publishing)"
        type: boolean
        default: false
      version:
        description: "Version to pack (default: the root package.json version)"
        type: string
        default: ""
      dist_tag:
        description: "npm dist-tag（默认 latest；预发布用 android-next，见 D21）"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: rust-npm-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: pack ${{ matrix.package-id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # 发布矩阵：linux-x64/arm64、darwin-arm64、win32-x64（Intel Mac 不发布）。
          # Android 自 2026-11-17 起不再经 npm 发布：NIBI-GO 已把内核 fork 到本仓，
          # 由 NIBI-GO/kernel 自建；package.mjs 仍保留 Android 打包能力供手动验证，
          # 下方 NDK 步骤因 matrix 无 android 不会运行。
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package-id: linux-x64-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package-id: linux-arm64-gnu
          # `macos-14` 已不可调度：用它的 job 会零 step 直接被取消（每次都 cancelled，
          # 不报错也不失败，所以一直没人注意到 darwin 平台包从来没产出过）。改用
          # `macos-latest`（arm64），与 target 一致，也与本仓其他 workflow 一致。
          - os: macos-latest
            target: aarch64-apple-darwin
            package-id: darwin-arm64
          # Windows 平台包只服务本机命令行（远端执行器的 `Platform` 仍只有 linux/darwin）。
          # runner 直接编 x86_64-pc-windows-msvc，二进制在包内必须叫 `bin/nibi.exe`。
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package-id: win32-x64-msvc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # Android 才需要：把 NDK 的 clang / llvm-ar 交给 cc 与 rustc。runner 镜像自带 NDK
      # （`ANDROID_NDK_HOME`）。在 `kernel/` 下跑，`rustup target add` 会加到
      # rust-toolchain.toml 钉住的 1.95.0，而不是上一步的 stable。
      - name: Prepare the Android NDK toolchain
        if: matrix.target == 'aarch64-linux-android'
        working-directory: kernel
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          NDK="${ANDROID_NDK_HOME:?the runner image must provide ANDROID_NDK_HOME}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # `bin/nibi-rs` 的 API（开发机对照）；cdylib 在后面的独立 step 用 API 24 重链。
          API=26
          CC="$TOOLCHAIN/aarch64-linux-android${API}-clang"
          test -x "$CC"
          {
            echo "CC_aarch64-linux-android=$CC"
            echo "CXX_aarch64-linux-android=${CC}++"
            echo "AR_aarch64-linux-android=$TOOLCHAIN/llvm-ar"
            echo "RANLIB_aarch64-linux-android=$TOOLCHAIN/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CC"
          } >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1
        with:
          node-version: "24.22.1"

      # 版本只有一处：`inputs.version` 或根 package.json。它同时喂给内核（NIBI_RELEASE_VERSION，
      # 编译期写进 `nibi --version`）与 npm 包（package.json / build.json），三处必须逐字相同：
      # 内核按自身版本向注册表精确取执行器，版本不同源时精确请求恒 404、每次远端部署都要多退 latest。
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          [ -n "$VERSION" ] || VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "NIBI_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      # 交叉编译的 target 与 runner 同架构，只有 android 不能在本机执行（产物要等 Phase C 上真机）。
      - name: Build kernel binary
        working-directory: kernel
        run: cargo build --locked --release -p nibi-kernel-cli --bin nibi-rs --target ${{ matrix.target }}

      # Android cdylib：先保存 bin（下面 cargo clean 会删掉本包产物），再用 API 24 的
      # NDK clang 重链 `libnibi.so`。这样 bin 保持 API 26，进程内库满足 GO minSdk=24。
      - name: Build Android cdylib
        if: matrix.target == 'aarch64-linux-android'
        working-directory: kernel
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          cp "target/$TARGET/release/nibi-rs" "$RUNNER_TEMP/nibi-rs"
          cargo clean -p nibi-kernel-cli
          NDK="${ANDROID_NDK_HOME:?the runner image must provide ANDROID_NDK_HOME}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API=24
          CLANG="$TOOLCHAIN/aarch64-linux-android${API}-clang"
          test -x "$CLANG"
          # cc/rustc 读的是带连字符的变量名（`CC_<target>`），而 bash 的 `export` 只接受
          # 合法标识符，写成 `export CC_aarch64-linux-android=...` 会报 not a valid
          # identifier。`env` 能给单条命令注入任意名字的环境变量，正好够用。
          env \
            "CC_aarch64-linux-android=$CLANG" \
            "CXX_aarch64-linux-android=${CLANG}++" \
            "AR_aarch64-linux-android=$TOOLCHAIN/llvm-ar" \
            "RANLIB_aarch64-linux-android=$TOOLCHAIN/llvm-ranlib" \
            "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG" \
            cargo build --locked --release -p nibi-kernel-cli --lib --target "$TARGET"
          cp "target/$TARGET/release/libnibi.so" "$RUNNER_TEMP/libnibi.so"
          # 不用 `readelf | grep` 管道：runner 上曾出现管道在 grep 提前退出后把整步判成 74。
          # 先落文件再做纯文本断言，成功/失败都有稳定的退出码。
          file -b "$RUNNER_TEMP/libnibi.so" > "$RUNNER_TEMP/libnibi-file.txt"
          grep -q "ELF 64-bit LSB shared object" "$RUNNER_TEMP/libnibi-file.txt" || {
            echo "libnibi.so 不是 64 位 ELF 共享对象：" >&2
            cat "$RUNNER_TEMP/libnibi-file.txt" >&2
            exit 1
          }
          "$TOOLCHAIN/llvm-nm" -D --defined-only "$RUNNER_TEMP/libnibi.so" \
            > "$RUNNER_TEMP/libnibi-symbols.txt"
          grep -q "nibi_app_server_start" "$RUNNER_TEMP/libnibi-symbols.txt" || {
            echo "libnibi.so 缺少 nibi_app_server_start 导出" >&2
            exit 1
          }
          # 16 KB page size（Play 对 targetSdk 35+ 的要求）：所有 LOAD 段必须 2**14 对齐。
          # 对齐值在 `llvm-readelf -l` 的最后一列；NDK r27 默认 4 KB，靠 .cargo/config.toml
          # 的链接参数抬到 16 KB。同样先落文件，不用管道。
          "$TOOLCHAIN/llvm-readelf" -l "$RUNNER_TEMP/libnibi.so" \
            > "$RUNNER_TEMP/libnibi-program-headers.txt"
          LOAD_ALIGNS="$(awk '$1 == "LOAD" { print $NF }' "$RUNNER_TEMP/libnibi-program-headers.txt")"
          if [ -z "$LOAD_ALIGNS" ]; then
            echo "libnibi.so 没有 LOAD 段，无法确认 16 KB 对齐" >&2
            exit 1
          fi
          for ALIGN in $LOAD_ALIGNS; do
            if [ "$ALIGN" != "0x4000" ]; then
              echo "libnibi.so 的 LOAD 段对齐是 $ALIGN，不是 16 KB（0x4000，见 kernel/.cargo/config.toml）" >&2
              exit 1
            fi
          done
          SHARED="$(find "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android" -name 'libc++_shared.so' -print -quit)"
          if [ -n "$SHARED" ]; then
            cp "$SHARED" "$RUNNER_TEMP/libc++_shared.so"
          fi

      - name: Assert the binary reports the release version
        if: matrix.target != 'aarch64-linux-android'
        shell: bash
        run: |
          set -euo pipefail
          BIN="kernel/target/${{ matrix.target }}/release/nibi-rs"
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            BIN="$BIN.exe"
          fi
          REPORTED="$("$BIN" --version | awk '{print $2}')"
          if [ "$REPORTED" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::the kernel reports $REPORTED but the package is ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Pack npm platform package
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          echo "packing version $VERSION"
          TARGET="${{ matrix.target }}"
          BINARY="kernel/target/$TARGET/release/nibi-rs"
          if [ "$TARGET" = "x86_64-pc-windows-msvc" ]; then
            BINARY="$BINARY.exe"
          fi
          EXTRA=()
          if [ "$TARGET" = "aarch64-linux-android" ]; then
            BINARY="$RUNNER_TEMP/nibi-rs"
            EXTRA+=(--lib "$RUNNER_TEMP/libnibi.so")
            if [ -f "$RUNNER_TEMP/libc++_shared.so" ]; then
              EXTRA+=(--shared-lib "$RUNNER_TEMP/libc++_shared.so")
            fi
          fi
          # macOS runner 自带的是 bash 3.2：`set -u` + 空数组直接展开 `"${EXTRA[@]}"`
          # 会报 unbound variable（linux runner 的 bash 4.4+ 不会）。用条件展开兼容两者。
          node scripts/rust-cli/npm/package.mjs \
            --binary "$BINARY" \
            --target "$TARGET" \
            --version "$VERSION" \
            --out "$RUNNER_TEMP/npm-pack" \
            ${EXTRA[@]+"${EXTRA[@]}"} | tee "$RUNNER_TEMP/pack.json"
          # Windows runner 的 pack.json 里是 `D:\a\_temp\...`（反斜杠）。upload-artifact
          # 按 glob 处理 path，反斜杠会被当转义，结果 tarball 被静默跳过、只上传 pack.json。
          # 路径通过 argv 传给 node：直接拼进 JS 字符串时 `\a` 会被当成未知转义吃掉。
          TARBALL_PATH="$(node -e 'console.log(require(process.argv[1]).tarball)' "$RUNNER_TEMP/pack.json")"
          TARBALL_PATH="${TARBALL_PATH//\\//}"
          echo "tarball=$TARBALL_PATH" >> "$GITHUB_OUTPUT"

      # 打包脚本已经自己校验过 ELF/Mach-O 头与 sha256；这里再跑一次 self-test，
      # 保证平台包与 META 包的打包器本身没坏（PR 也跑，不必等发布）。
      - name: Packer self-test
        run: node --test scripts/rust-cli/npm/package.test.mjs scripts/rust-cli/npm/meta-package.test.mjs

      - name: Upload tarball
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4
        with:
          name: npm-pack-${{ matrix.package-id }}
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ runner.temp }}/pack.json
          if-no-files-found: error
          retention-days: 14

  # 发布：只在手动勾选 `publish` 时跑。npm CLI 自动识别 GitHub Actions 的 OIDC 环境并换取
  # 短期发布凭证（npm ≥ 11.5.1、Node ≥ 22.14；两者都满足，缺了会明确报错）。同一个版本
  # 已经存在时跳过，手动重跑不会因为 409 失败。
  publish:
    name: publish ${{ matrix.package-id }}
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish)
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            package-id: linux-x64-gnu
          - os: ubuntu-24.04-arm
            package-id: linux-arm64-gnu
          - os: macos-latest
            package-id: darwin-arm64
          - os: windows-latest
            package-id: win32-x64-msvc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1
        with:
          node-version: "24.22.1"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-pack-${{ matrix.package-id }}
          path: pack

      - name: Publish with OIDC
        shell: bash
        run: |
          set -euo pipefail
          # trusted publishing 要求 npm CLI ≥ 11.5.1（Node 24 自带的一般满足，升级一次最稳）。
          npm install --global npm@^11.5.1 >/dev/null
          echo "npm $(npm --version)"
          TARBALL="$(find pack -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          PKG="$(node -p "require('./pack/pack.json').name")"
          VERSION="$(node -p "require('./pack/pack.json').version")"
          # 标签发版时，标签必须就是包里那个版本（防止 v4.0.2 的标签发出 4.0.1 的包）。
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match the packed version ${VERSION}"
              exit 1
            fi
          fi
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PKG@$VERSION is already published; nothing to do"
            exit 0
          fi
          # D21：预发布版本走专用 dist-tag（android-next），绝不打 latest；
          # 标签发版（push v*）恒为 latest。
          DIST_TAG="${{ inputs.dist_tag }}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            DIST_TAG=latest
          fi
          [ -n "$DIST_TAG" ] || DIST_TAG=latest
          case "$VERSION" in
            *-*)
              if [ "$DIST_TAG" = "latest" ]; then
                echo "::error::预发布版本 $VERSION 不允许打 latest 标签；请传 dist_tag（如 android-next）"
                exit 1
              fi
              ;;
          esac
          npm publish "$TARBALL" --access public --provenance --tag "$DIST_TAG"

  # META 入口包：平台包全部成功发布后才跑（`needs: publish` 会等所有 matrix leg）。
  # 它自己有 pack + publish 两步，因为 META 包与平台包不同 runner、没有二进制要构建。
  # 仍然走 OIDC、provenance、标签/版本守卫与 skip-existing，和平台包同一套规则。
  meta:
    name: publish @nibi-studio/cli
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish)
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1
        with:
          node-version: "24.22.1"

      # 与平台包同一个版本来源：`inputs.version` 或根 package.json。
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          [ -n "$VERSION" ] || VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Packer self-test
        run: node --test scripts/rust-cli/npm/meta-package.test.mjs

      - name: Pack META package
        id: pack
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          echo "packing META version $VERSION"
          node scripts/rust-cli/npm/meta-package.mjs \
            --version "$VERSION" \
            --out "$RUNNER_TEMP/meta-pack" | tee "$RUNNER_TEMP/meta-pack.json"
          echo "tarball=$(node -p "require('$RUNNER_TEMP/meta-pack.json').tarball")" >> "$GITHUB_OUTPUT"

      # META 的 optionalDependencies 是精确版本；四个平台包缺一个都不能发 META，
      # 否则该平台的 `npm install -g @nibi-studio/cli` 会装出没有 `nibi-rs` 的空壳。
      #
      # npm publish 返回 202 后版本要过恶意扫描才在注册表可见（大二进制包常见几十秒到几分钟），
      # 紧接着 `npm view` 会 404。这里等到可见为止，避免平台包其实已经发布却把 META 判失败。
      - name: Verify every pinned platform package is published
        run: |
          set -euo pipefail
          wait_for_package() {
            local spec="$1"
            for attempt in $(seq 1 36); do
              if npm view "$spec" version >/dev/null 2>&1; then
                echo "found $spec"
                return 0
              fi
              echo "waiting for $spec (attempt ${attempt}/36)"
              sleep 10
            done
            return 1
          }
          while IFS= read -r spec; do
            if ! wait_for_package "$spec"; then
              echo "::error::$spec is still missing after 6 minutes; publish the platform packages before the META package"
              exit 1
            fi
          done < <(
            node -e 'const m = require(process.argv[1]); for (const [name, version] of Object.entries(m.platformPackages)) console.log(`${name}@${version}`)' \
              "$RUNNER_TEMP/meta-pack.json"
          )

      - name: Publish META package with OIDC
        run: |
          set -euo pipefail
          # trusted publishing 要求 npm CLI ≥ 11.5.1（Node 24 自带的一般满足，升级一次最稳）。
          npm install --global npm@^11.5.1 >/dev/null
          echo "npm $(npm --version)"
          TARBALL="${{ steps.pack.outputs.tarball }}"
          test -f "$TARBALL"
          PKG="$(node -p "require('$RUNNER_TEMP/meta-pack.json').name")"
          VERSION="$(node -p "require('$RUNNER_TEMP/meta-pack.json').version")"
          # 标签发版时，标签必须就是包里那个版本。
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match the packed version ${VERSION}"
              exit 1
            fi
          fi
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PKG@$VERSION is already published; nothing to do"
            exit 0
          fi
          # 与平台包同一套 dist-tag 规则（D21）：预发布走 android-next，不打 latest。
          DIST_TAG="${{ inputs.dist_tag }}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            DIST_TAG=latest
          fi
          [ -n "$DIST_TAG" ] || DIST_TAG=latest
          case "$VERSION" in
            *-*)
              if [ "$DIST_TAG" = "latest" ]; then
                echo "::error::预发布版本 $VERSION 不允许打 latest 标签；请传 dist_tag（如 android-next）"
                exit 1
              fi
              ;;
          esac
          npm publish "$TARBALL" --access public --provenance --tag "$DIST_TAG"
