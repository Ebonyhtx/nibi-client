name: rust-npm-packages

# 远端执行器的平台包（`@nibi-studio/cli-<platform>`）：构建 + 打包成 tarball，作为 artifact 上传。
#
# 消费方是 Rust 内核的 `machines/executor_dist`（从 npm 注册表取 tarball、校验
# `dist.integrity` 的 sha512、解出 `package/bin/nibi-rs`）。
#
# 发布走 **npm trusted publishing（OIDC）**，不需要任何 secret，所以能留在公开仓：
# 每条 publish 用的是 GitHub Actions 签发的短期 OIDC 令牌，npm 只接受在包的
# 「Trusted Publisher」设置里登记过的 仓库 + workflow 文件名（本文件：rust-npm-packages.yml）。
# 前置（一次性，运营者在 npmjs.com 上给每个已发布的包各配一次）：组织/用户 `Ebonyhtx`、仓库
# `nibi-client`、workflow `rust-npm-packages.yml`、允许 `npm publish`。
# 新包（如 `@nibi-studio/cli-android-arm64`）首次发布前要先确认 npm 上的 trusted publisher 已登记。
#
# 自动发布只在手动触发 `publish: true` 时跑（版本号一经 publish 就永久占用），
# 默认的 push / PR 只打包上传 artifact。
#
# 所有 action 必须钉到完整 commit SHA（public-repo-policy 要求）。

on:
  push:
    # 只写了 `tags` 时 GitHub **不会**为分支推送触发（分支过滤是未定义状态）。这里只在发布分支
    # `main` 上打包（`dev` 的 kernel 变更不跑平台 release 构建，避免拖长流水线）；打
    # `v<版本>` 标签才发布，`dev` 上要临时打包/发版走 workflow_dispatch。
    branches:
      - "main"
    paths:
      - "kernel/**"
      - "scripts/rust-cli/npm/**"
      - ".github/workflows/rust-npm-packages.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "kernel/**"
      - "scripts/rust-cli/npm/**"
      - ".github/workflows/rust-npm-packages.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the packed tarballs to npm (trusted publishing)"
        type: boolean
        default: false
      version:
        description: "Version to pack (default: the root package.json version)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: rust-npm-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: pack ${{ matrix.package-id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # 与 scripts/rust-cli/npm/package.mjs 的 TARGETS 一一对应（Intel Mac 不发布）。
          # android 只走 npm 分发（NIBI-GO 直接消费），不进内核 ssh-connect 的 `Platform`：
          # 那张表是 SSH 远端部署用的，Android 上的 uname 仍然是 Linux/aarch64。
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package-id: linux-x64-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package-id: linux-arm64-gnu
          # `macos-14` 已不可调度：用它的 job 会零 step 直接被取消（每次都 cancelled，
          # 不报错也不失败，所以一直没人注意到 darwin 平台包从来没产出过）。改用
          # `macos-latest`（arm64），与 target 一致，也与本仓其他 workflow 一致。
          - os: macos-latest
            target: aarch64-apple-darwin
            package-id: darwin-arm64
          # Android：NDK 的 clang 交叉编译；runner 镜像自带 NDK（`ANDROID_NDK_HOME`）。
          # 产物动态链 NDK 的 `libc++_shared.so`（cc 默认），Phase C 打包时一并放进 jniLibs。
          - os: ubuntu-24.04
            target: aarch64-linux-android
            package-id: android-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # Android 才需要：把 NDK 的 clang / llvm-ar 交给 cc 与 rustc。runner 镜像自带 NDK
      # （`ANDROID_NDK_HOME`）。在 `kernel/` 下跑，`rustup target add` 会加到
      # rust-toolchain.toml 钉住的 1.95.0，而不是上一步的 stable。
      - name: Prepare the Android NDK toolchain
        if: matrix.target == 'aarch64-linux-android'
        working-directory: kernel
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          NDK="${ANDROID_NDK_HOME:?the runner image must provide ANDROID_NDK_HOME}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # NIBI-GO Phase C 的最低 API；改这里要同步 app 的 minSdk。
          API=26
          CC="$TOOLCHAIN/aarch64-linux-android${API}-clang"
          test -x "$CC"
          {
            echo "CC_aarch64-linux-android=$CC"
            echo "CXX_aarch64-linux-android=${CC}++"
            echo "AR_aarch64-linux-android=$TOOLCHAIN/llvm-ar"
            echo "RANLIB_aarch64-linux-android=$TOOLCHAIN/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CC"
          } >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1
        with:
          node-version: "24.22.1"

      # 版本只有一处：`inputs.version` 或根 package.json。它同时喂给内核（NIBI_RELEASE_VERSION，
      # 编译期写进 `nibi --version`）与 npm 包（package.json / build.json），三处必须逐字相同：
      # 内核按自身版本向注册表精确取执行器，版本不同源时精确请求恒 404、每次远端部署都要多退 latest。
      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          [ -n "$VERSION" ] || VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "NIBI_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      # 交叉编译的 target 与 runner 同架构，只有 android 不能在本机执行（产物要等 Phase C 上真机）。
      - name: Build kernel binary
        working-directory: kernel
        run: cargo build --locked --release -p nibi-kernel-cli --bin nibi-rs --target ${{ matrix.target }}

      - name: Assert the binary reports the release version
        if: matrix.target != 'aarch64-linux-android'
        run: |
          set -euo pipefail
          REPORTED="$(kernel/target/${{ matrix.target }}/release/nibi-rs --version | awk '{print $2}')"
          if [ "$REPORTED" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::the kernel reports $REPORTED but the package is ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Pack npm platform package
        id: pack
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "packing version $VERSION"
          node scripts/rust-cli/npm/package.mjs \
            --binary "kernel/target/${{ matrix.target }}/release/nibi-rs" \
            --target "${{ matrix.target }}" \
            --version "$VERSION" \
            --out "$RUNNER_TEMP/npm-pack" | tee "$RUNNER_TEMP/pack.json"
          echo "tarball=$(node -p "require('$RUNNER_TEMP/pack.json').tarball")" >> "$GITHUB_OUTPUT"

      # 打包脚本已经自己校验过 ELF/Mach-O 头与 sha256；这里再跑一次 self-test，
      # 保证脚本本身没坏（PR 也跑，不必等发布）。
      - name: Packer self-test
        run: node --test scripts/rust-cli/npm/package.test.mjs

      - name: Upload tarball
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4
        with:
          name: npm-pack-${{ matrix.package-id }}
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ runner.temp }}/pack.json
          if-no-files-found: error
          retention-days: 14

  # 发布：只在手动勾选 `publish` 时跑。npm CLI 自动识别 GitHub Actions 的 OIDC 环境并换取
  # 短期发布凭证（npm ≥ 11.5.1、Node ≥ 22.14；两者都满足，缺了会明确报错）。同一个版本
  # 已经存在时跳过，手动重跑不会因为 409 失败。
  publish:
    name: publish ${{ matrix.package-id }}
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish)
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            package-id: linux-x64-gnu
          - os: ubuntu-24.04-arm
            package-id: linux-arm64-gnu
          - os: macos-latest
            package-id: darwin-arm64
          - os: ubuntu-24.04
            package-id: android-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1
        with:
          node-version: "24.22.1"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-pack-${{ matrix.package-id }}
          path: pack

      - name: Publish with OIDC
        run: |
          set -euo pipefail
          # trusted publishing 要求 npm CLI ≥ 11.5.1（Node 24 自带的一般满足，升级一次最稳）。
          npm install --global npm@^11.5.1 >/dev/null
          echo "npm $(npm --version)"
          TARBALL="$(find pack -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          PKG="$(node -p "require('./pack/pack.json').name")"
          VERSION="$(node -p "require('./pack/pack.json').version")"
          # 标签发版时，标签必须就是包里那个版本（防止 v4.0.2 的标签发出 4.0.1 的包）。
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match the packed version ${VERSION}"
              exit 1
            fi
          fi
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PKG@$VERSION is already published; nothing to do"
            exit 0
          fi
          npm publish "$TARBALL" --access public --provenance

