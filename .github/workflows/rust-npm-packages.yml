name: rust-npm-packages

# 远端执行器的平台包（`@nibi/cli-<platform>`）：构建 + 打包成 tarball，作为 artifact 上传。
#
# 消费方是 Rust 内核的 `machines/executor_dist`（从 npm 注册表取 tarball、校验
# `dist.integrity` 的 sha512、解出 `package/bin/nibi-rs`）。**打包不等于发布**：
# 本 workflow 只产出 artifact，`publish` job 需要人工在 GitHub UI 上 approve
# （environment: npm-publish），且要仓库 secret `NPM_TOKEN` 才可能成功。
#
# 为什么不自动发：npm 版本号一经 publish 就永久占用；远端执行器的用户入口
# （机器清单 `/machines`）还在后续阶段，Rust 内核也仍是灰度（默认 node）。
# 发布前置 = Rust 切默认 + 远端入口上线，见 docs/planning/step9b-brand-inventory。
#
# 所有 action 必须钉到完整 commit SHA（public-repo-policy 要求）。

on:
  push:
    paths:
      - "kernel/**"
      - "scripts/rust-cli/npm/**"
      - ".github/workflows/rust-npm-packages.yml"
  pull_request:
    paths:
      - "kernel/**"
      - "scripts/rust-cli/npm/**"
      - ".github/workflows/rust-npm-packages.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "打包后进入 publish job（仍需人工 approve + NPM_TOKEN）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rust-npm-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: pack ${{ matrix.package-id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # 与 scripts/rust-cli/npm/package.mjs 的 TARGETS、以及内核
          # `Platform::published()` 一一对应（Intel Mac 不发布）。
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package-id: linux-x64-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package-id: linux-arm64-gnu
          - os: macos-14
            target: aarch64-apple-darwin
            package-id: darwin-arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Build kernel binary
        working-directory: kernel
        run: cargo build --locked --release -p nibi-kernel-cli --bin nibi-rs --target ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1
        with:
          node-version: "24.22.1"

      - name: Pack npm platform package
        id: pack
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/rust-cli/npm/package.mjs \
            --binary "kernel/target/${{ matrix.target }}/release/nibi-rs" \
            --target "${{ matrix.target }}" \
            --version "$VERSION" \
            --out "$RUNNER_TEMP/npm-pack" | tee "$RUNNER_TEMP/pack.json"
          echo "tarball=$(node -p "require('$RUNNER_TEMP/pack.json').tarball")" >> "$GITHUB_OUTPUT"

      # 打包脚本已经自己校验过 ELF/Mach-O 头与 sha256；这里再跑一次 self-test，
      # 保证脚本本身没坏（PR 也跑，不必等发布）。
      - name: Packer self-test
        run: node --test scripts/rust-cli/npm/package.test.mjs

      - name: Upload tarball
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4
        with:
          name: npm-pack-${{ matrix.package-id }}
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ runner.temp }}/pack.json
          if-no-files-found: error
          retention-days: 14

  # 人工闸门：没有 approve 不会跑，没有 NPM_TOKEN 直接失败。
  # 手动触发时把 `publish` 勾上才会进入这个 job。
  publish:
    name: publish to npm (manual gate)
    needs: pack
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e881e0000aab4a191e # v4.1.8
        with:
          pattern: npm-pack-*
          path: npm-pack
          merge-multiple: true

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1
        with:
          node-version: "24.22.1"
          registry-url: "https://registry.npmjs.org"

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured; refusing to publish." >&2
            exit 1
          fi
          for tarball in npm-pack/*.tgz; do
            echo "publishing $tarball"
            npm publish --access public "$tarball"
          done
