name: desktop-e2e-container

# Manual desktop interaction E2E. The image runs an Electron build inside a
# Linux container with replay-isolated network access, so no provider key or
# repository secret is required.
#
# 触发方式：
# - `push` 到 dev/main 且改动落在 packages/** 等路径时，跑默认那 5 个 spec。
#   这是这套用例**唯一**的自动化入口——在此之前它只有 workflow_dispatch，
#   实际运行次数是 0，422 个 e2e 用例在 CI 里完全没有覆盖。
# - `workflow_dispatch` 保留给全量/定点排查，可以指定任意 spec。
#
# 注意：镜像大、单轮要几分钟，所以只在上面那些路径变化时跑，且**暂不进合并必过项**
# ——先在 CI 里积累稳定性证据，再讨论是否升为门禁。

on:
  push:
    branches: [dev, main]
    paths:
      - "packages/**"
      - "kernel/**"
      - "apps/**"
      - "pnpm-lock.yaml"
      # 镜像与运行脚本变了同样要跑：这套用例的失败大多来自它们，而不是测试代码。
      - "Dockerfile.desktop-e2e"
      - ".dockerignore"
      - "scripts/test-desktop-e2e-container.sh"
      - ".github/workflows/desktop-e2e.yml"
  workflow_dispatch:
    inputs:
      spec:
        description: "Comma-separated specs, relative to packages/desktop (capture-only specs like upstream-provider cannot run under replay-isolated)"
        required: false
        default: "./test/e2e/container-boot.test.ts,./test/e2e/smoke.test.ts,./test/e2e/e2ecase-regression.test.ts,./test/e2e/task-list-archive-confirmation.test.ts,./test/e2e/conversation-session/conversation-session-ask-user-question-keyboard-default-focus.test.ts,./test/e2e/conversation-session/conversation-session-ask-user-question-keyboard-navigation.test.ts,./test/e2e/conversation-session/conversation-session-conversation-workspace.test.ts"
      skip_image_build:
        description: "Reuse an existing local image (only useful on a persistent machine)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-e2e-container
  cancel-in-progress: false

jobs:
  desktop-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run container E2E
        shell: bash
        env:
          E2E_SPEC: ${{ inputs.spec }}
          SKIP_IMAGE_BUILD: ${{ inputs.skip_image_build && '1' || '0' }}
          # push 触发时复用 GitHub Actions 的镜像层缓存，避免每次全量重建。
          DOCKER_CACHE: ${{ github.event_name == 'push' && 'gha' || '' }}
        run: bash scripts/test-desktop-e2e-container.sh
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-e2e-artifacts
          path: packages/desktop/.e2e-artifacts/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
