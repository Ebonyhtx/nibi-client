name: client-gates

# Public repository gates. Runs on GitHub-hosted runners only.
#
# The public repository must never use self-hosted runners, repository secrets,
# or pull_request_target. The `policy` job enforces those rules together with
# the public-tree scanner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: public-repo-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.14.0"
      - name: Public tree policy
        run: node scripts/check-public-repo.mjs

  linux-gates:
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.14.0"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.1.0
        with:
          version: 10.33.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build contracts and CLI packages
        run: pnpm --filter @nibi/contracts build && pnpm -r --filter "./apps/zcode-cli/packages/*" build
      - name: Lint
        run: pnpm run lint
      - name: Accessibility gate
        run: node scripts/check-ui-a11y.mjs
      - name: Architecture gate
        run: pnpm run architecture:check
      - name: Architecture governance self-test
        run: pnpm run test:architecture
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests (3 shards)
        shell: bash
        run: |
          failed=0
          for shard in 1 2 3; do
            pnpm run test:unit --shard=$shard/3 --project unit --project fork-isolated --maxWorkers=2 || failed=1
          done
          exit $failed
      - name: CLI unit tests
        working-directory: apps/zcode-cli
        run: ../../node_modules/.bin/turbo run test --filter=./packages/* --continue --concurrency=2

  windows-gates:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.14.0"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.1.0
        with:
          version: 10.33.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build contracts and CLI packages
        run: pnpm --filter @nibi/contracts build && pnpm -r --filter "./apps/zcode-cli/packages/*" build
      - name: Lint
        run: pnpm run lint
      - name: Accessibility gate
        run: node scripts/check-ui-a11y.mjs
      - name: Architecture gate
        run: pnpm run architecture:check
      - name: Architecture governance self-test
        run: pnpm run test:architecture
      - name: Typecheck
        run: pnpm run typecheck
      - name: Windows-only tests
        run: pnpm exec vitest run --project windows-only --maxWorkers=1
      - name: Unit tests (3 shards)
        shell: bash
        run: |
          failed=0
          for shard in 1 2 3; do
            pnpm run test:unit --shard=$shard/3 --project unit --project fork-isolated --maxWorkers=1 || failed=1
          done
          exit $failed
      - name: CLI unit tests
        working-directory: apps/zcode-cli
        run: ../../node_modules/.bin/turbo run test --filter=./packages/* --continue --concurrency=2

  macos-gates:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.14.0"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.1.0
        with:
          version: 10.33.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build contracts and CLI packages
        run: pnpm --filter @nibi/contracts build && pnpm -r --filter "./apps/zcode-cli/packages/*" build
      - name: Lint
        run: pnpm run lint
      - name: Accessibility gate
        run: node scripts/check-ui-a11y.mjs
      - name: Architecture gate
        run: pnpm run architecture:check
      - name: Architecture governance self-test
        run: pnpm run test:architecture
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests (3 shards)
        shell: bash
        run: |
          failed=0
          for shard in 1 2 3; do
            pnpm run test:unit --shard=$shard/3 --project unit --project fork-isolated --maxWorkers=2 || failed=1
          done
          exit $failed
      - name: CLI unit tests
        working-directory: apps/zcode-cli
        run: ../../node_modules/.bin/turbo run test --filter=./packages/* --continue --concurrency=2
