name: client-gates

# Public repository gates. Runs on GitHub-hosted runners only.
#
# The public repository must never use self-hosted runners, repository secrets,
# or pull_request_target. The `policy` job enforces those rules together with
# the public-tree scanner.
#
# 2026-11-02 运行时长优化：静态检查与单测分片拆开，单测分片改为**每个分片一台 runner 并行**
# （Windows 4、Linux/macOS 3）。之前分片在同一个 job 里串行执行，Windows 单测一项就要 30+
# 分钟，且 threads worker 在长分片末尾累计堆 OOM 时整轮要等 80+ 分钟才知道失败。分片并行后
# 单分片文件数不变（仍用 2 个 threads worker），墙钟由「分片之和」降为「最慢分片」；
# `linux`/`windows`/`macos` 保留为聚合 job，分支保护的必需上下文不变。静态检查仍按 OS 各跑
# 一次，覆盖面与之前一致。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: public-repo-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Public tree policy
        run: node scripts/check-public-repo.mjs

  linux-static:
    name: linux-static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build contracts, CLI and e2e-report packages
        run: pnpm --filter @nibi/contracts build && pnpm -r --filter "./apps/zcode-cli/packages/*" build && pnpm --filter @nibi/e2e-report build:node
      - name: Lint
        run: pnpm run lint
      - name: Accessibility gate
        run: node scripts/check-ui-a11y.mjs
      - name: Architecture gate
        run: pnpm run architecture:check
      - name: NIBI command schema drift gate
        run: pnpm exec tsx scripts/kernel-baseline/generate-nibi-command-schema.ts --check
      - name: Architecture governance self-test
        run: pnpm run test:architecture
      - name: Typecheck
        run: pnpm run typecheck

  linux-tests:
    name: linux-tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build contracts, CLI and e2e-report packages
        run: pnpm --filter @nibi/contracts build && pnpm -r --filter "./apps/zcode-cli/packages/*" build && pnpm --filter @nibi/e2e-report build:node
      - name: Unit tests (shard ${{ matrix.shard }}/3)
        run: pnpm run test:unit --shard=${{ matrix.shard }}/3 --project unit --project fork-isolated --maxWorkers=2
      - name: CLI unit tests
        if: matrix.shard == 1
        working-directory: apps/zcode-cli
        run: ../../node_modules/.bin/turbo run test --filter=./packages/* --continue --concurrency=2

  linux:
    name: linux
    needs: [linux-static, linux-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate
        run: |
          echo "linux-static=${{ needs['linux-static'].result }} linux-tests=${{ needs['linux-tests'].result }}"
          test "${{ needs['linux-static'].result }}" = "success"
          test "${{ needs['linux-tests'].result }}" = "success"

  windows-static:
    name: windows-static
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build contracts, CLI and e2e-report packages
        run: pnpm --filter @nibi/contracts build && pnpm -r --filter "./apps/zcode-cli/packages/*" build && pnpm --filter @nibi/e2e-report build:node
      - name: Lint
        run: pnpm run lint
      - name: Accessibility gate
        run: node scripts/check-ui-a11y.mjs
      - name: Architecture gate
        run: pnpm run architecture:check
      - name: Architecture governance self-test
        run: pnpm run test:architecture
      - name: Typecheck
        run: pnpm run typecheck

  windows-only:
    name: windows-only
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      # 4 核 runner 上 taskkill/PowerShell 身份查询比开发机慢一个数量级；这个 knob 只放大
      # 等待预算，残留仍按 OS 事实判定。只作用于这组真实进程清理用例，unit 全套不缩放。
      NIBI_PROCESS_TREE_CLEANUP_BUDGET_SCALE: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build contracts, CLI and e2e-report packages
        run: pnpm --filter @nibi/contracts build && pnpm -r --filter "./apps/zcode-cli/packages/*" build && pnpm --filter @nibi/e2e-report build:node
      - name: Windows-only tests
        run: pnpm exec vitest run --project windows-only --maxWorkers=1

  windows-tests:
    name: windows-tests (${{ matrix.shard }}/4)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build contracts, CLI and e2e-report packages
        run: pnpm --filter @nibi/contracts build && pnpm -r --filter "./apps/zcode-cli/packages/*" build && pnpm --filter @nibi/e2e-report build:node
      # threads worker 在 shard 1 累计堆超限（4 分片 ~475 文件、6 分片 ~316 文件都复现）。
      # 两个 worker 把单 worker 的文件数减半，峰值随之下降；forks 虽隔离但单文件进程启动在
      # windows-latest 上过慢，且出现 runner 丢日志，不再采用。
      - name: Unit tests (shard ${{ matrix.shard }}/4)
        run: pnpm run test:unit --shard=${{ matrix.shard }}/4 --project unit --project fork-isolated --maxWorkers=2
      - name: CLI unit tests
        if: matrix.shard == 1
        working-directory: apps/zcode-cli
        run: ../../node_modules/.bin/turbo run test --filter=./packages/* --continue --concurrency=2

  windows:
    name: windows
    needs: [windows-static, windows-only, windows-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate
        run: |
          echo "windows-static=${{ needs['windows-static'].result }} windows-only=${{ needs['windows-only'].result }} windows-tests=${{ needs['windows-tests'].result }}"
          test "${{ needs['windows-static'].result }}" = "success"
          test "${{ needs['windows-only'].result }}" = "success"
          test "${{ needs['windows-tests'].result }}" = "success"

  macos-static:
    name: macos-static
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build contracts, CLI and e2e-report packages
        run: pnpm --filter @nibi/contracts build && pnpm -r --filter "./apps/zcode-cli/packages/*" build && pnpm --filter @nibi/e2e-report build:node
      - name: Lint
        run: pnpm run lint
      - name: Accessibility gate
        run: node scripts/check-ui-a11y.mjs
      - name: Architecture gate
        run: pnpm run architecture:check
      - name: Architecture governance self-test
        run: pnpm run test:architecture
      - name: Typecheck
        run: pnpm run typecheck

  macos-tests:
    name: macos-tests (${{ matrix.shard }}/3)
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build contracts, CLI and e2e-report packages
        run: pnpm --filter @nibi/contracts build && pnpm -r --filter "./apps/zcode-cli/packages/*" build && pnpm --filter @nibi/e2e-report build:node
      - name: Unit tests (shard ${{ matrix.shard }}/3)
        run: pnpm run test:unit --shard=${{ matrix.shard }}/3 --project unit --project fork-isolated --maxWorkers=2
      - name: CLI unit tests
        if: matrix.shard == 1
        working-directory: apps/zcode-cli
        run: ../../node_modules/.bin/turbo run test --filter=./packages/* --continue --concurrency=2

  macos:
    name: macos
    needs: [macos-static, macos-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate
        run: |
          echo "macos-static=${{ needs['macos-static'].result }} macos-tests=${{ needs['macos-tests'].result }}"
          test "${{ needs['macos-static'].result }}" = "success"
          test "${{ needs['macos-tests'].result }}" = "success"
