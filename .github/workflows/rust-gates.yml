name: rust-gates

# FIX-10a/10b：Rust 内核的供应链门禁。
# 只在 kernel/ 或本文件变化时运行；没有 kernel/ 的树不会触发（等价于空跑）。
#
# 门禁内容：
# - cargo deny check（advisories / bans / licenses / sources）
# - cargo audit（RustSec 公告库）
# - webpki-root-certs 版本断言（>= 1.0.11，FIX-10b 下限）
# - cargo check --locked --workspace（vendored 树至少能编译）
# - cargo test --locked --workspace（全量单元/集成测试；`windows_process` 是 cfg(windows)，
#   这里不跑，Windows 专有分支由本地/打包机覆盖。步骤级超时 30 分钟，避免拖长流水线）
# - macOS 专有分支编译（单独一个 macos-latest job，原因见该 job 的注释）
#
# 所有 action 必须钉到完整 commit SHA（public-repo-policy 要求）。

on:
  push:
    paths:
      - "kernel/**"
      - ".github/workflows/rust-gates.yml"
  pull_request:
    paths:
      - "kernel/**"
      - ".github/workflows/rust-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-gates:
    name: rust-supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95.0"
          components: clippy,rustfmt
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-deny
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-audit
      - name: cargo deny check
        working-directory: kernel
        run: cargo deny check
      - name: cargo audit
        working-directory: kernel
        run: cargo audit
      - name: trust roots >= 1.0.11
        working-directory: kernel
        shell: bash
        run: |
          version="$(cargo tree -i webpki-root-certs --locked --prefix none \
            | sed -n 's/^webpki-root-certs v\([0-9][0-9.]*\).*/\1/p' \
            | head -1)"
          if [ -z "$version" ]; then
            echo "webpki-root-certs not found in the dependency graph" >&2
            exit 1
          fi
          echo "webpki-root-certs=$version"
          if [ "$(printf '%s\n' 1.0.11 "$version" | sort -V | head -1)" != "1.0.11" ]; then
            echo "webpki-root-certs must be >= 1.0.11 (got $version)" >&2
            exit 1
          fi
      - name: cargo check
        working-directory: kernel
        run: cargo check --locked --workspace
      - name: nibi-platform tests
        working-directory: kernel
        run: cargo test -p nibi-platform --locked
      # 全量测试（2026-11-09 接入）：与 `cargo check` 同一个 job，复用已编译的依赖与共享 target，
      # 冷启动也就多出测试二进制的一次构建。`--no-fail-fast` 让一轮跑出所有失败，不用逐条重跑。
      # 步骤级 timeout 是闸门：超时说明有测试挂住，按失败处理，不拖到 job 的 45 分钟。
      - name: cargo test
        working-directory: kernel
        timeout-minutes: 30
        run: cargo test --locked --workspace --no-fail-fast

  # 只在本机 macOS 上编译到的分支（`cfg(unix, not(target_os = "linux"))` 与
  # `cfg(target_os = "macos")`）不会出现在 ubuntu 的 checks 里：proc 的 macOS 采样器就曾在这里
  # 漏过（本地 Windows 与 ubuntu 都不编译它），`cli` 的 `scutil --proxy` 系统代理同理。
  #
  # 这一步必须跑在真 macOS 上，不能在 ubuntu 上 `--target aarch64-apple-darwin` 交叉检查：
  # `nibi-kernel-ext` 为了付费插件验签依赖 `nibi-platform`，而 `nibi-platform` 带 `ring`
  # （C 代码）。交叉编译 ring 需要 Apple SDK，ubuntu 的 gcc 不认 `-arch arm64` /
  # `-mmacosx-version-min`，于是这条门禁在 ext 新增该依赖后一直是红的（不是代码回归）。
  # 公开仓的 macOS runner 不额外计费，直接原生编译最稳。
  macos-only:
    name: rust-macos-only
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95.0"
          targets: aarch64-apple-darwin
      - name: macOS-only code compiles
        working-directory: kernel
        run: |
          cargo check --locked \
            -p nibi-kernel-proc -p nibi-kernel-fs -p nibi-kernel-policy \
            -p nibi-kernel-session -p nibi-kernel-ext -p nibi-kernel-cli \
            --target aarch64-apple-darwin

