name: source-server-release

# 远端 Source Server 的发布产物：四个平台包（`nibi-server-<target>.tar.gz`）与
# `source-server-release.json`。产物由 `pnpm prepare:remote-assets` 在**一台 POSIX 主机**上
# 顺序组装（下载目标平台的 Node、node-pty/koffi/native-search、Agent bundle），不是 Rust 交叉编译。
#
# 为什么只能跑在 Linux/macOS：staging 里 `spawn("pnpm")`，Windows 没有 `pnpm.exe`（ENOENT）；
# 且 Windows 的 tar 写不出 POSIX 执行位，远端解压后直接执行 `bin/zcode` 会 Permission denied。
#
# 产物不在这里发 CDN：发布要走服务器上的 `tools/publish-content.py`（OSS 凭据只在服务器上）。
# 流程：Run workflow → 下载 artifact → scp 到 `/srv/nibi-site/content/releases/electron/<版本>/`
# → `publish-content.py --only releases`。见 docs/release-process.md。
#
# 所有 action 必须钉到完整 commit SHA（public-repo-policy 要求）。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-server-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1
        with:
          node-version: "24.22.1"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage the four POSIX source-server archives
        env:
          NIBI_ENV: production
        run: pnpm prepare:remote-assets

      # descriptor 是唯一的发布合同：版本必须等于产品版本，四个 target 齐全，sha256 / size 与
      # 磁盘一致；执行位是远端能直接 `bin/zcode` 的前提（Windows 构建就是在这里坏的）。
      - name: Verify the descriptor and the archives
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          DIR="packages/desktop/mock-cdn/releases/$VERSION"
          test -f "$DIR/source-server-release.json"
          jq -e --arg version "$VERSION" '
            .schemaVersion == 1
            and .version == $version
            and ([.archives[].target] | sort) == ["darwin-arm64","darwin-x64","linux-arm64","linux-x64"]
            and all(.archives[]; .version == $version)
          ' "$DIR/source-server-release.json" > /dev/null
          ( cd "$DIR" && jq -r '.archives[] | "\(.sha256)  \(.fileName)"' source-server-release.json | sha256sum -c - )
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            file="$DIR/nibi-server-$target.tar.gz"
            expected="$(jq -r --arg target "$target" '.archives[] | select(.target == $target) | .sizeBytes' "$DIR/source-server-release.json")"
            test "$(stat -c%s "$file")" = "$expected"
            permissions="$(tar -tvzf "$file" | awk '$NF ~ /(^|\/)bin\/zcode$/ || $NF ~ /(^|\/)runtime\/node$/ {print $1}')"
            test "$(printf '%s\n' "$permissions" | grep -c '^-rwx')" = "2"
          done

      - name: Upload the release files
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4
        with:
          name: source-server-release
          path: |
            packages/desktop/mock-cdn/releases/*/source-server-release.json
            packages/desktop/mock-cdn/releases/*/nibi-server-*.tar.gz
          if-no-files-found: error
          retention-days: 14
