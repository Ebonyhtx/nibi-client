name: desktop-package-gates

# 打包轨门禁（391265f1 本地链 + f70f58ac 初版 CI 的升级）：三平台各跑一次**真实打包**
# （bundle.mjs → electron-builder），断言 Rust 内核二进制进了打包资源位次，并对**打包产物里的
# 内核**跑 --prepare-storage 冒烟。
#
# 无内网依赖（2026-11-01 全链实测）：本机打包链自 4.0 起不下载 GLM 原生二进制（resources/glm
# 是 JS bundle）；native-search 与 electron-builder 辅助包在无 NIBI_DEPS_BASE_URL 时走官方/
# repository 回退（bundle.mjs 的开源构建回退分支）。CI 环境与本机打包同构。
#
# 所有 action 必须钉到完整 commit SHA（public-repo-policy 要求）。

on:
  push:
    paths:
      - "kernel/**"
      - "packages/desktop/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/desktop-package/**"
      - "scripts/native-search-tools-config.mjs"
      - ".github/workflows/desktop-package-gates.yml"
  pull_request:
    paths:
      - "kernel/**"
      - "packages/desktop/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/desktop-package/**"
      - "scripts/native-search-tools-config.mjs"
      - ".github/workflows/desktop-package-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-package-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-gate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle-os: linux
            bundle-arch: x64
            kernel-exe: nibi-rs
            resource-dir: packages/desktop/dist/linux-unpacked/resources
          - os: windows-latest
            bundle-os: win
            bundle-arch: x64
            kernel-exe: nibi-rs.exe
            resource-dir: packages/desktop/dist/win-unpacked/resources
          - os: macos-latest
            bundle-os: mac
            bundle-arch: arm64
            kernel-exe: nibi-rs
            resource-dir: packages/desktop/dist/mac-arm64/NIBI.app/Contents/Resources
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: cargo build (release, kernel binary)
        working-directory: kernel
        run: cargo build --locked --release -p nibi-kernel-cli --bin nibi-rs
      # fpm 的 pacman 后端要 bsdtar（ubuntu runner 没有；exit 127 实测）。deb/rpm/AppImage 不需要。
      - name: Install bsdtar (pacman target needs it)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools
      - name: Package the desktop app (kernel staged via prepare:rust-kernel)
        working-directory: packages/desktop
        env:
          NIBI_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
        run: node scripts/bundle.mjs --os=${{ matrix.bundle-os }} --arch=${{ matrix.bundle-arch }}
      - name: Assert the packaged kernel binary
        shell: bash
        run: |
          test -f "${{ matrix.resource-dir }}/rust-kernel/${{ matrix.kernel-exe }}" || {
            echo "missing ${{ matrix.resource-dir }}/rust-kernel/${{ matrix.kernel-exe }}" >&2
            exit 1
          }
          echo "packaged kernel present"
      - name: Assert the kernel ships with its license material
        shell: bash
        run: |
          # 内嵌二进制必须带 Apache-2.0 许可证与第三方归属（rg/bfs/ugrep + vendor/copied 的复制代码）。
          # 缺任何一份都说明 prepare:rust-kernel 的 stage 被绕过或有人删了归属文件。
          for material in LICENSE THIRD-PARTY-NOTICES.txt; do
            test -s "${{ matrix.resource-dir }}/rust-kernel/${material}" || {
              echo "missing ${{ matrix.resource-dir }}/rust-kernel/${material}" >&2
              exit 1
            }
          done
          grep -q "openai-codex" "${{ matrix.resource-dir }}/rust-kernel/THIRD-PARTY-NOTICES.txt" || {
            echo "packaged notices do not carry the copied-code attribution" >&2
            exit 1
          }
          echo "packaged kernel license material present"
      - name: Smoke the packaged kernel (storage handshake)
        run: node scripts/desktop-package/smoke-prepare-storage.mjs "${{ matrix.resource-dir }}/rust-kernel/${{ matrix.kernel-exe }}"
