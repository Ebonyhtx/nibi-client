[package]
name = "nibi-kernel-query"
description = "Query loop, streaming tool executor and recovery of nibi-kernel-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
nibi-kernel-base.workspace = true
nibi-kernel-api.workspace = true
nibi-kernel-prompts.workspace = true
tokio = { workspace = true, features = ["sync"] }
serde_json.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
nibi-kernel-api = { workspace = true, features = ["testing"] }
