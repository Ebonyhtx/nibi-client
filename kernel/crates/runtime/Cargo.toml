[package]
name = "nibi-kernel-runtime"
description = "Assembles the nibi-kernel-cli kernel from its capability crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
# 读对照数据的测试只在完整的源码仓库编译（docs/specs/rust-cli/export.md §5）；不传给依赖。
parity = []

[dependencies]
async-trait.workspace = true
# /context 的计数并发发出（`join!`）、按请求内容缓存（docs/specs/rust-cli/context-usage.md §3）。
futures-util = { workspace = true, features = ["async-await", "async-await-macro"] }
serde_json.workspace = true
nibi-kernel-base.workspace = true
nibi-kernel-api.workspace = true
nibi-kernel-agents.workspace = true
nibi-kernel-compact.workspace = true
nibi-kernel-context.workspace = true
nibi-kernel-ext.workspace = true
nibi-kernel-hooks.workspace = true
nibi-kernel-policy.workspace = true
# /context 的延迟加载规则看模型卡片（docs/specs/rust-cli/context-usage.md §3）。
nibi-kernel-prompts.workspace = true
nibi-kernel-query.workspace = true
nibi-kernel-session.workspace = true
nibi-kernel-tools.workspace = true
tracing.workspace = true
# 附件的 data URL（Node `writePromptAttachment` 同形，写入侧也要编码）。
base64.workspace = true
# 升级问答的停驻 future（`tokio::sync::oneshot`）与常驻池的 60 s 兜底采样（`tokio::time::sleep`）。
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util.workspace = true

[dev-dependencies]
futures-util.workspace = true
nibi-kernel-api = { workspace = true, features = ["testing"] }
# 钩子评审的测试用真实文件系统（工作区里的 `.nibi/config.json`）；本机写盘只经 nibi-kernel-fs。
nibi-kernel-env-local.workspace = true
nibi-kernel-fs.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# 暂停时钟（blocked_board_tests 的提醒档走虚拟毫秒，F17 的先例——watchdog 同款）。
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
tokio-util.workspace = true
