[package]
name = "nibi-kernel-peers"
description = "Local cross-session messaging for nibi-kernel-cli: the session registry and the inbox socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
nibi-kernel-base.workspace = true
nibi-kernel-fs.workspace = true
nibi-kernel-api.workspace = true
nibi-kernel-net.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true

[dev-dependencies]
nibi-kernel-api = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
