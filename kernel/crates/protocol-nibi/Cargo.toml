[package]
name = "rust-cli-protocol-nibi"
description = "The App protocol front end of rust-cli (V4 methods, commands, topics and the legacy methods the Host still calls)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait.workspace = true
# wire v3 的分片（dataBase64）。
base64.workspace = true
rust-cli-base.workspace = true
rust-cli-kernel-api.workspace = true
# 网络捕获挂在出口的观察者上（141 审计 §9 F3，`process/networkCapture`）。
rust-cli-net.workspace = true
# 账号模型的每请求鉴权来源（G8，HeaderSource）。
rust-cli-platform.workspace = true
rust-cli-protocol-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# 附件事务 commit 的 sha256 校验（Host `createHash("sha256")` 同算法）。
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
futures-util.workspace = true
rust-cli-kernel-api = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }
