[package]
name = "nibi-kernel-protocol-nibi"
description = "The App protocol front end of nibi-kernel-cli (V4 methods, commands, topics and the legacy methods the Host still calls)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait.workspace = true
# wire v3 的分片（dataBase64）。
base64.workspace = true
# 子代理目录跟着 agents 的变化通知刷新（`subagent_changes()` 是 BoxStream）。
futures-util.workspace = true
nibi-kernel-base.workspace = true
nibi-kernel-api.workspace = true
# 网络捕获挂在出口的观察者上（141 审计 §9 F3，`process/networkCapture`）。
nibi-kernel-net.workspace = true
# 账号模型的每请求鉴权来源（G8，HeaderSource）。
nibi-kernel-platform.workspace = true
nibi-kernel-protocol-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# 附件事务 commit 的 sha256 校验（Host `createHash("sha256")` 同算法）。
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "sync", "time"] }
# 工作区补全的取消令牌（`Kernel::generate_text` 的签名）。
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
futures-util.workspace = true
nibi-kernel-api = { workspace = true, features = ["testing"] }
# broker 的 Unix socket 落在测试自己的临时目录里。
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }
