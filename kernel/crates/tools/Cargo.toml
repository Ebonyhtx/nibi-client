[package]
name = "nibi-kernel-tools"
description = "Tool registry, execution pipeline and built-in tools of nibi-kernel-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
regex.workspace = true
nibi-kernel-base.workspace = true
nibi-kernel-api.workspace = true
nibi-kernel-policy.workspace = true
nibi-kernel-prompts.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
# WaitSessions 的取消令牌与工具取消共用 `ToolUseContext::cancel`。
tokio-util.workspace = true
tracing.workspace = true
# CronList 按显示宽度截断 prompt。
unicode-width.workspace = true
# WebFetch 的 URL 校验、重定向地址解析（WHATWG URL 规则）。
url.workspace = true

[dev-dependencies]
nibi-kernel-api = { workspace = true, features = ["testing"] }
# X02 对拍：TodoRead / TodoWrite 由 agents 层注册，测试把它们的工具实例并入注册表枚举。
nibi-kernel-agents.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
tokio-util.workspace = true
