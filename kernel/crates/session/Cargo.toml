[package]
name = "nibi-kernel-session"
description = "Session actor: the owner of a session's state in nibi-kernel-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
nibi-kernel-base.workspace = true
nibi-kernel-api.workspace = true
# 会话标题的提示词（docs/specs/rust-cli/titles.md §1）。
nibi-kernel-prompts.workspace = true
nibi-kernel-query.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
nibi-kernel-api = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
