[package]
name = "nibi-kernel-api"
description = "Ports and shared types of the nibi-kernel-cli kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
# 工具路径参数的 NFC（env_path::nfc，tools-files.md §3.2）。
icu_normalizer.workspace = true
nibi-kernel-base.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# 网络捕获的 URL 脱敏（network_capture.rs，141 审计 F3）。
url.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[features]
# 测试用的假端口（testing 模块）；只在其他 crate 的 dev-dependencies 里打开。
testing = []
