# NIBI 内核供应链门禁（FIX-10a/10b）。
# 上游 0.1.67 没有 deny.toml；本文件由 NIBI 维护，vendoring 后首次跑绿。
# 每次重 pin 都要重跑：cargo deny check && cargo audit。

[graph]
all-features = true

[advisories]
# RustSec 官方公告库；只读拉取，不上传任何数据。
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  # bincode 1.3.3 无安全升级路径；只经 syntect/two-face 进入 TUI（Track B，不在桌面内核关键路径）。
  # 切流点删除 tui crate 时一并移除本豁免（Rust 规划 §4.7 组件处置表）。
  "RUSTSEC-2025-0141",
]

[licenses]
# 允许的许可证集合：全部为宽松/可静态链接的常见许可证。
# 复合表达式（如 "MIT OR Apache-2.0"）只要有一个分支命中即可。
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "WTFPL",
  "Zlib",
]
confidence-threshold = 0.9
# 本仓自己的 crate 声明为 Apache-2.0，不需要逐个取证。
private = { ignore = true }

[bans]
multiple-versions = "warn"
# workspace 继承依赖（`dep.workspace = true`）在 lockfile 里解析成本仓 path+版本，
# cargo-deny 仍会把它报成 wildcard；这里降为 warn，避免对正常的 workspace 继承误报。
wildcards = "warn"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
