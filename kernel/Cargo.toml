# nibi-kernel-cli：NIBI 的 Rust 内核（可执行名 nibi-rs；规格历史路径 docs/specs/rust-cli/）。
# 自包含：不 path 依赖本目录以外的 crate；从仓库其他位置复制的代码在文件头注明来源。
# crate 之间的依赖方向由 scripts/rust-cli/check-boundaries.mjs 的 ALLOWED 表约束。
[workspace]
members = [
  "crates/base",
  "crates/paths",
  "crates/fs",
  "crates/proc",
  "crates/net",
  "crates/kernel-api",
  "crates/prompts",
  "crates/node-store",
  "crates/nibi-platform",
  "crates/model",
  "crates/env-local",
  "crates/exec-wire",
  "crates/exec-transport",
  "crates/exec-client",
  "crates/exec-server",
  "crates/env-remote",
  "crates/executor-host",
  "crates/ssh-connect",
  "crates/machines",
  "crates/peers",
  "crates/policy",
  "crates/hooks",
  "crates/context",
  "crates/tools",
  "crates/compact",
  "crates/memory",
  "crates/agents",
  "crates/ext",
  "crates/query",
  "crates/session",
  "crates/runtime",
  "crates/platform",
  "crates/tui",
  "crates/headless",
  "crates/protocol-core",
  "crates/protocol-nibi",
  "crates/cli",
]
# 第三方源码（rg、bfs、ugrep，docs/specs/rust-cli/embedded-search.md）：cli 的 path 依赖，不是成员——不受本工程的
# lints 与 clippy.toml 约束，也不在 crates/ 的边界检查里（边界脚本把它们当作只有 cli 能用的 IO 类第三方库）。
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# 规则来源：docs/specs/rust-engineering-practices.md §2.1；与 rust/Cargo.toml 的列表相同。
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_collect = "deny"
needless_question_mark = "deny"
# 终端界面与 stream-json 都占用 stdout；库 crate 不打印，测试中由 clippy.toml 放行。
print_stderr = "deny"
print_stdout = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_to_owned = "deny"
# 新代码从第一天起不允许 unwrap / expect（测试由 clippy.toml 放行），每个 unsafe 块都要写 SAFETY 说明。
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[workspace.dependencies]
# 只列出已使用的依赖（cargo-shear 会拒绝未使用的 workspace 依赖）。
anyhow = "1"
# nibi-kernel-net 的出口策略快照（R4）：热替换时整份发布，读的一方不必等。
arc-swap = "1"
async-trait = "0.1"
# nibi-kernel-platform：credentials.json 的 base64url（Node `Buffer` 的 base64url，无填充）。
base64 = "0.23"
bytes = "1"
# nibi-kernel-tui：终端输入流（event-stream）；与 ratatui 0.30 的 crossterm 后端同版本。
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# nibi-kernel-cli（cli）：解开执行器的 npm 平台包（gzip，remote-exec.md §26.4）。Cargo.lock 里本来就有（syntect 用它，同样的
# 缺省特性 rust_backend），不引入新包。
flate2 = "1"
# Retry-After 的 HTTP-date 形式。
httpdate = "1"
# nibi-kernel-tui：markdown 解析（复制来的组件层，docs/specs/rust-cli/tui.md §3）。
pulldown-cmark = { version = "0.13", default-features = false }
# nibi-kernel-tui：全屏终端界面。
ratatui = "0.30"
# nibi-kernel-tui：unix 上探测终端背景色（OSC 11）时的 poll / read。
rustix = { version = "1", features = ["event"] }
# nibi-kernel-tui：代码块、diff 与命令的高亮（主题来自 two-face）。
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
# nibi-kernel-tui：搜索按字素匹配（docs/specs/rust-cli/tui-input.md §2.3.3，F114）；Cargo.lock 里本来就有（ratatui 用它）。
unicode-segmentation = "1.13"
unicode-width = "0.2"
# kernel-api `env_path::nfc`：工具路径参数的 NFC（docs/specs/rust-cli/tools-files.md §3.2）。
# Cargo.lock 里本来就有（url → idna → idna_adapter），只打开内置数据，不引入新包。
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
# 内容搜索：ripgrep 自己的搜索库（env-local 的 Grep，docs/specs/rust-cli/tools-files.md §3）。
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
# 目录遍历、忽略规则与 rg 的 --glob / --type 语义（env-local 的 Glob / Grep）。
ignore = "0.4"
libc = "0.2"
# nibi-kernel-cli（cli）：Linux musl 版的全局分配器（docs/specs/rust-cli/linux.md §8.3，工作线 F44）。只在 `*-linux-musl`
# 进依赖图；不打开 override（C 代码仍用 musl 的 malloc）。
mimalloc = { version = "0.1.52", default-features = false }
# env-local：持久定时任务文件的监听（.zcode/scheduled_tasks.json，docs/specs/rust-cli/tools-more.md §16.2）。
notify = "8"
regex = "1"
# nibi-kernel-platform：Provider 规则的 matcher 是 JS RegExp 语法（look-around），与 Host / Node 相同用 ECMAScript 语义。
regress = "0.12"
# nibi-kernel-platform：credentials.json 的 AES-256-GCM（与 rustls 共用同一个 ring）。
ring = "0.17"
# 只在 nibi-kernel-net。与 apps/zcode-cli-rust 同为 0.13；关闭 system-proxy（默认特性），代理只按显式配置。
# rustls-no-provider 不自带算法，统一用 ring（与 rustls 的 ring 特性配套）。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# 只在 nibi-kernel-net：内置的 Mozilla 根证书（docs/specs/rust-cli/config.md §2.4，工作线 F44）。Cargo.lock 里本来就有
# （rustls-platform-verifier 在 wasm 上用它），不引入新包。
webpki-root-certs = "1"
# 只有 node-store 使用（spec §4：rusqlite 只在 sqlite / node-store）；bundled 自带 SQLite，不依赖系统库。
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", default-features = false, features = ["std"] }
# preserve_order：JS 的 JSON 文本按插入顺序输出键（nibi_kernel_base::js::json），Node 记录逐字节一致依赖它。
serde_json = { version = "1", features = ["preserve_order"] }
# Node 迁移校验和 sha256(sql.trim())。
sha2 = "0.10"
tempfile = "3"
# 只在测试：真实进程测试里现生成 CA 与服务器证书（docs/specs/rust-cli/config.md §5，F21）；与 rustls 共用 ring。
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
thiserror = "2"
# nibi-kernel-platform：Provider 配置的 baseUrl 校验（与 Host 相同用 WHATWG URL 解析）。
url = "2"
uuid = { version = "1", features = ["v4"] }
# 只打开不做 IO 的特性。做 IO 的特性（fs、process、io-std、net）由用到的 crate 自己声明，
# scripts/rust-cli/check-boundaries.mjs 按 README §4 的表核对（F7，审查 R2-9：以前 process / fs / net 对全体打开）。
# clippy.toml 里 tokio::fs / net / process 的禁令写 `allow-invalid = true`，单独检查没打开这些特性的 crate 时不报路径无效。
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
# 只用 CancellationToken。
tokio-util = { version = "0.7", default-features = false }
# 只用门面宏；订阅者由入口 crate 安装。
tracing = { version = "0.1", default-features = false, features = ["std"] }
# nibi-kernel-proc 的 Job Object；cli 的系统时区与系统版本（`RtlGetVersion`，修复线 F65）。
windows-sys = { version = "0.61", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Time",
] }

nibi-kernel-base = { path = "crates/base" }
nibi-kernel-paths = { path = "crates/paths" }
nibi-kernel-net = { path = "crates/net" }
nibi-kernel-fs = { path = "crates/fs" }
nibi-kernel-platform = { path = "crates/platform" }
nibi-platform = { path = "crates/nibi-platform" }
nibi-kernel-proc = { path = "crates/proc" }
nibi-kernel-prompts = { path = "crates/prompts" }
nibi-kernel-api = { path = "crates/kernel-api" }
nibi-kernel-node-store = { path = "crates/node-store" }
nibi-kernel-model = { path = "crates/model" }
nibi-kernel-env-local = { path = "crates/env-local" }
nibi-kernel-exec-wire = { path = "crates/exec-wire" }
nibi-kernel-exec-transport = { path = "crates/exec-transport" }
nibi-kernel-exec-client = { path = "crates/exec-client" }
nibi-kernel-exec-server = { path = "crates/exec-server" }
nibi-kernel-env-remote = { path = "crates/env-remote" }
nibi-kernel-executor-host = { path = "crates/executor-host" }
nibi-kernel-machines = { path = "crates/machines" }
nibi-kernel-ssh-connect = { path = "crates/ssh-connect" }
nibi-kernel-peers = { path = "crates/peers" }
nibi-kernel-policy = { path = "crates/policy" }
nibi-kernel-hooks = { path = "crates/hooks" }
nibi-kernel-context = { path = "crates/context" }
nibi-kernel-tools = { path = "crates/tools" }
nibi-kernel-compact = { path = "crates/compact" }
nibi-kernel-agents = { path = "crates/agents" }
nibi-kernel-ext = { path = "crates/ext" }
nibi-kernel-memory = { path = "crates/memory" }
nibi-kernel-query = { path = "crates/query" }
nibi-kernel-session = { path = "crates/session" }
nibi-kernel-runtime = { path = "crates/runtime" }
nibi-kernel-tui = { path = "crates/tui" }
nibi-kernel-headless = { path = "crates/headless" }
nibi-kernel-protocol-core = { path = "crates/protocol-core" }
nibi-kernel-protocol-nibi = { path = "crates/protocol-nibi" }

[profile.release]
lto = "thin"
strip = true

# 开发/测试不带调试符号：Windows 上每个测试二进制都会生成一个 ~0.4 GB 的 .pdb，反复 `cargo test`
# 会按哈希各留一份（实测累积到 240 GB，D 盘被塞满）。CI 与发布都用 release，不受影响；
# 真要调试时用 `CARGO_PROFILE_DEV_DEBUG=2 cargo build` 临时覆盖。
[profile.dev]
debug = 0

[profile.test]
debug = 0
